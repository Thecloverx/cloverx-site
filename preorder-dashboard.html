<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>พรีออเดอร์ · CloverX</title>
<style>
:root{
 --bg:#EEF3FA;--card:#FFFFFF;--ink:#0F1B2D;--sub:#64748B;--mut:#94A3B8;--line:#E4EAF2;
 --brand:#2563EB;--brand2:#1D4ED8;--tint:#EAF1FE;
 --good:#16A34A;--goodbg:#DCFCE7;--goodtint:#ECFDF3;
 --warn:#B45309;--warnbg:#FEF3C7;--warntint:#FFFBEB;
 --info:#0EA5E9;--infobg:#E0F2FE;--bad:#DC2626;--badbg:#FEE2E2;
 --violet:#7C3AED;--pink:#EC4899;--teal:#0D9488;
 --shadow:0 1px 3px rgba(16,27,45,.05),0 8px 24px rgba(16,27,45,.05);
 --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head .title{display:flex;align-items:center;gap:10px}
.head h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.head .sub{margin:4px 0 0;color:var(--sub);font-size:.85rem}
.head .badge{display:inline-flex;align-items:center;gap:5px;background:var(--goodtint);color:var(--good);border:1px solid #BBF7D0;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-family:inherit;font-size:.82rem;font-weight:600;color:var(--brand);cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{background:var(--tint)}
.hbtn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
.hbtn.solid:hover{background:var(--brand2)}
/* filter chips */
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-family:inherit;font-size:.83rem;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters .note{margin-left:auto;color:var(--mut);font-size:.8rem}
/* grids */
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.mb{margin-bottom:16px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.kpi .lb{color:var(--sub);font-size:.8rem;font-weight:600}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .d{margin-top:5px;font-size:.78rem;color:var(--sub)}
.kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--bad)}.kpi .d.warn{color:var(--warn)}
/* section */
.sec{margin-top:22px}
.sec>h2{font-size:1.05rem;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:9px}
.sec .stamp{margin-left:auto;font-size:.74rem;color:var(--mut);font-weight:400}
.panel{padding:18px}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.ph h3{margin:0;font-size:.98rem;font-weight:700}
.ph .meta{font-size:.78rem;color:var(--mut)}
/* action cards */
.act{padding:16px;border-radius:14px;border:1px solid var(--line)}
.act .lb{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--sub);margin-bottom:7px}
.act .v{font-size:1.35rem;font-weight:800}
.act .s{font-size:.78rem;color:var(--sub);margin-top:3px}
.act.good{background:var(--goodtint);border-color:#BBF7D0}.act.good .v{color:var(--good)}
.act.warn{background:var(--warntint);border-color:#FDE68A}.act.warn .v{color:var(--warn)}
.act.info{background:#F0F9FF;border-color:#BAE6FD}.act.info .v{color:var(--info)}
.act.brand{background:var(--tint);border-color:#C7DBFE}.act.brand .v{color:var(--brand)}
/* hero block */
.herowrap{display:grid;grid-template-columns:300px 1fr;gap:14px}
.donut{display:flex;align-items:center;gap:20px}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;background:conic-gradient(var(--brand) calc(var(--p)*1%),#E5EEFB 0);display:flex;align-items:center;justify-content:center}
.ring .inner{width:104px;height:104px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .inner b{font-size:1.5rem;font-weight:800;line-height:1}
.ring .inner small{color:var(--mut);font-size:.68rem;margin-top:2px}
.herostat .big{font-size:1.4rem;font-weight:800}
.herostat .lb{color:var(--sub);font-size:.82rem}
.herostat p{margin:3px 0 0;color:var(--sub);font-size:.8rem}
.herocards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hc{border-radius:14px;padding:16px;position:relative;overflow:hidden}
.hc .ic{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.hc .v{font-size:1.6rem;font-weight:800}
.hc .lb{font-size:.8rem;opacity:.92;margin-top:2px}
.hc.blue{background:linear-gradient(135deg,#2E7DF6,#1B54C7);color:#fff}
.hc.plain{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.hc.plain .ic{background:var(--tint);color:var(--brand)}
.hc.plain .lb{color:var(--sub);opacity:1}
.hc .corner{position:absolute;top:14px;right:16px;font-size:.8rem;font-weight:700;color:var(--good)}
/* tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;font-size:.85rem;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:.76rem;text-transform:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.pname{font-weight:700}.psub{color:var(--mut);font-size:.76rem;font-weight:400}
.twrap{overflow-x:auto}
/* bars */
.barrow{margin-bottom:13px}
.barrow:last-child{margin-bottom:0}
.barrow .l{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px}
.barrow .l b{font-weight:700}.barrow .l span{color:var(--sub)}
.track{height:9px;background:#EEF2F8;border-radius:99px;overflow:hidden}
.track b{display:block;height:100%;border-radius:99px}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.rank{width:24px;height:24px;border-radius:7px;background:var(--tint);color:var(--brand);font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex:none}
.li .body{flex:1;min-width:0}
.li .t{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--mut);font-size:.76rem}
.li .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .amt small{display:block;color:var(--mut);font-weight:400;font-size:.72rem}
/* status pills */
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.st.paid{background:var(--goodbg);color:var(--good)}
.st.pending{background:var(--warnbg);color:var(--warn)}
.st.cancel{background:var(--badbg);color:var(--bad)}
.st.multi{background:#EDE9FE;color:var(--violet)}
/* chart */
.chart{width:100%;height:220px;display:block}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--sub);margin-bottom:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* pager + selects */
.pager{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap}
.pager button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-family:inherit;font-size:.82rem;cursor:pointer;color:var(--sub)}
.pager button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pager button:disabled{opacity:.4;cursor:default}
.selrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select.f{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:.82rem;color:var(--ink)}
.priv{color:var(--mut);font-size:.74rem;margin-top:10px;line-height:1.5}
.center{text-align:center;color:var(--mut);padding:40px 0}
.loading{text-align:center;padding:80px 0;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
/* responsive */
@media(max-width:960px){
 .g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}
 .herowrap{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
}
@media(max-width:560px){
 .wrap{padding:16px 13px 50px}.g6{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}
 .herocards{grid-template-columns:1fr}.head h1{font-size:1.25rem}.kpi .v{font-size:1.45rem}
 .donut{flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="head">
  <div>
   <div class="title"><h1>พรีออเดอร์</h1><span class="badge" id="liveBadge">● สด</span></div>
   <p class="sub" id="subLine">กำลังโหลดข้อมูล…</p>
  </div>
  <div class="hbtns">
   <button class="hbtn" onclick="location.href='/operations.html'">← Operations</button>
   <button class="hbtn solid" onclick="loadData()">รีเฟรช ⟳</button>
  </div>
 </div>
 <div class="filters" id="filters"></div>
 <div id="app"><div class="loading"><div class="spin"></div>กำลังดึงข้อมูลพรีออเดอร์…</div></div>
</div>

<script>
"use strict";
/* ================= CONFIG ================= */
var GOAL_AMOUNT = 2500000;   // เป้ายอดขาย (บาท)
var GOAL_SETS   = 200;       // เป้าจำนวนชุด
var CLOSE_RATE  = 0.93;      // อัตราปิดการขายโดยประมาณ (สำหรับยอดที่มีโอกาสปิด)
var PAGE_CUST=5, PAGE_REF=5, PAGE_PROV=10;

/* ================= HELPERS ================= */
function baht(n){return '฿'+Math.round(Number(n)||0).toLocaleString('en-US');}
function bahtK(n){n=Number(n)||0;return n>=1000?('฿'+Math.round(n/1000)+'k'):('฿'+Math.round(n));}
function num(n){return (Number(n)||0).toLocaleString('en-US');}
function pct(a,b){return b?Math.round(a/b*100):0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(id){return document.getElementById(id);}
/* status mapping: cloverx-site -> reference buckets */
function bucket(o){ var s=o.status; if(s==='paid'||s==='confirmed')return 'paid'; if(s==='rejected'||s==='cancelled')return 'cancel'; if(o.pay==='card'&&s==='pending')return 'awaitpay'; return 'pending'; }
function isLive(b){ return b==='paid'||b==='pending'; }
var ST_LABEL={paid:'ชำระแล้ว',pending:'รอตรวจสอบ',awaitpay:'รอลูกค้าชำระ',cancel:'ยกเลิก'};
/* Thai provinces for address matching */
var PROVINCES=["กรุงเทพมหานคร","กรุงเทพ","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];
function findProvince(addr){ addr=String(addr||''); for(var i=0;i<PROVINCES.length;i++){ if(addr.indexOf(PROVINCES[i])>=0){ return PROVINCES[i]==='กรุงเทพ'?'กรุงเทพมหานคร':PROVINCES[i]; } } return 'ไม่ระบุ'; }
/* decompose an item into atomic components for "นับชิ้นจริง" */
function components(nm){
 nm=String(nm||''); var color = nm.indexOf('ครีม')>=0?'สีครีม':(nm.indexOf('ดำ')>=0?'สีดำ':'');
 var band=function(){return 'Xircle Band'+(color?(' '+color):'');};
 if(/TRIPLE/i.test(nm))return [band(),'Xircle Scale','RoutineX'];
 if(/DUO/i.test(nm))return [band(),'Xircle Scale'];
 if(/TWIN/i.test(nm))return [band(),'RoutineX'];
 if(/Band/i.test(nm))return [band()];
 if(/Scale/i.test(nm))return ['Xircle Scale'];
 if(/RoutineX/i.test(nm))return ['RoutineX'];
 return [nm];
}
/* referrer commission tier by cumulative sales */
function tier(amt){ if(amt>=150000)return {r:0.25,t:'25%'}; if(amt>=80000)return {r:0.23,t:'23%'}; return {r:0.20,t:'20%'}; }
function maskPhone(p){ p=String(p||'').replace(/\D/g,''); return p?('••••'+p.slice(-4)):'—'; }
function maskName(n){ n=String(n||'').trim(); if(!n)return 'ลูกค้า'; var parts=n.split(/\s+/); var first=parts[0]; var last=parts.length>1?(parts[parts.length-1][0]+'.'):''; return first+(last?(' '+last):''); }

/* ================= STATE ================= */
var ALL=[], VIEW=[], RANGE='all';
var custPage=1, refPage=1, provPage=1;
var custFilters={team:'',status:'',product:''};
var SEG='day'; // มิติแบ่งกลุ่มสำหรับรายงาน CEO: day|team|xvisor|channel|campaign
function setSeg(v){ SEG=v; render(); }

/* ================= LOAD ================= */
function loadData(){
 el('app').innerHTML='<div class="loading"><div class="spin"></div>กำลังดึงข้อมูลพรีออเดอร์…</div>';
 fetch('/api/orders').then(function(r){return r.json();}).then(function(d){
  ALL=Array.isArray(d)?d:[]; applyRange();
 }).catch(function(){ el('app').innerHTML='<div class="center">โหลดข้อมูลไม่สำเร็จ</div>'; });
}
function inRange(o){
 if(RANGE==='all')return true;
 var t=new Date(o.at).getTime(); if(isNaN(t))return true; var now=Date.now(), day=86400000;
 if(RANGE==='today'){var d=new Date();d.setHours(0,0,0,0);return t>=d.getTime();}
 if(RANGE==='7')return t>=now-7*day;
 if(RANGE==='30')return t>=now-30*day;
 if(RANGE==='year'){return new Date(o.at).getFullYear()===new Date().getFullYear();}
 return true;
}
function applyRange(){ VIEW=ALL.filter(inRange); custPage=refPage=provPage=1; render(); }

/* ================= FILTER CHIPS ================= */
function renderFilters(){
 var opts=[['today','วันนี้'],['7','7 วัน'],['30','30 วัน'],['year','ปีนี้'],['all','ทั้งหมด']];
 el('filters').innerHTML=opts.map(function(o){return '<button class="chip'+(RANGE===o[0]?' on':'')+'" onclick="RANGE=\''+o[0]+'\';applyRange()">'+o[1]+'</button>';}).join('')
  +'<span class="note">· '+(RANGE==='all'?'ทุกช่วงเวลา':'ช่วง '+({today:'วันนี้','7':'7 วันล่าสุด','30':'30 วันล่าสุด',year:'ปีนี้'}[RANGE]))+'</span>';
}

/* ================= AGG ================= */
function agg(list){
 var a={n:list.length,sales:0,paidN:0,paidAmt:0,pendN:0,pendAmt:0,awaitN:0,awaitAmt:0,cancN:0,cancAmt:0,pieces:0,
   byBucket:{paid:0,pending:0,awaitpay:0,cancel:0}, buyers:{}, byPay:{card:{n:0,amt:0},bank:{n:0,amt:0}},
   prod:{}, comp:{}, sets:0, family:0, familyMap:{}, ref:{}, prov:{} };
 list.forEach(function(o){
  var b=bucket(o), tot=Number(o.total)||0;
  a.byBucket[b]++;
  if(b==='paid'){a.paidN++;a.paidAmt+=tot;}
  else if(b==='pending'){a.pendN++;a.pendAmt+=tot;}
  else if(b==='awaitpay'){a.awaitN++;a.awaitAmt+=tot;}
  else {a.cancN++;a.cancAmt+=tot;}
  if(b==='paid'||b==='pending'){ a.sales+=tot; a.sets++;
   var key=(o.phone||o.name||o.id); a.buyers[key]=(a.buyers[key]||0)+1;
   var pk=o.pay==='card'?'card':'bank'; a.byPay[pk].n++; a.byPay[pk].amt+=tot;
   var pv=findProvince(o.addr); a.prov[pv]=(a.prov[pv]||0)+1;
   var rf=(o.ref||'').trim(); if(rf){ if(!a.ref[rf])a.ref[rf]={n:0,amt:0}; a.ref[rf].n++; a.ref[rf].amt+=tot; }
  }
  (o.items||[]).forEach(function(it){
   var nm=String(it.nm||'-'); a.pieces++;
   if(!a.prod[nm])a.prod[nm]={paid:0,pending:0,awaitpay:0,cancel:0};
   a.prod[nm][b]++;
   if(it.fam){ a.family++; if(!a.familyMap[nm])a.familyMap[nm]={n:0,amt:0}; a.familyMap[nm].n++; a.familyMap[nm].amt+=(Number(it.price)||0); }
   if(b==='paid'||b==='pending'){ components(nm).forEach(function(c){ if(!a.comp[c])a.comp[c]={paid:0,pending:0}; a.comp[c][b==='paid'?'paid':'pending']++; }); }
  });
 });
 a.uniqueBuyers=Object.keys(a.buyers).length;
 a.repeatBuyers=Object.keys(a.buyers).filter(function(k){return a.buyers[k]>1;}).length;
 return a;
}

/* ================= RENDER ================= */
function render(){
 renderFilters();
 var A=agg(VIEW);
 var stamp=new Date().toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
 el('subLine').innerHTML='ข้อมูลรวมระบบพรีออเดอร์ · อัปเดต '+stamp+' · '+num(A.n)+' ออเดอร์';
 if(!VIEW.length){ el('app').innerHTML='<div class="card panel"><div class="center">ยังไม่มีข้อมูลออเดอร์ในช่วงเวลานี้</div></div>'; return; }
 var h='';
 h+=kpiRow(A);
 h+=ceoSection(A);
 h+=stockRow(A);
 h+=perProductTable(A);
 h+=actionCards(A);
 h+=heroBlock(A);
 h+=paymentBlocks(A);
 h+=itemsAndFamily(A);
 h+=dailyChart();
 h+=customerSection();
 h+=referrerSection(A);
 h+=provinceSection(A);
 el('app').innerHTML=h;
 drawChart();
}

function kpiRow(A){
 var goalPct=(A.sales/GOAL_AMOUNT*100);
 var setsPct=pct(A.sets,GOAL_SETS);

function drawChart(){
 var svg=el('dchart'); if(!svg)return;
 var days=[]; var map={};
 VIEW.forEach(function(o){ if(!isLive(bucket(o)))return; var d=new Date(o.at); if(isNaN(d))return; var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); map[k]=(map[k]||0)+1; });
 var keys=Object.keys(map).sort(); if(!keys.length){svg.innerHTML='';return;}
 var start=new Date(keys[0]), end=new Date(keys[keys.length-1]);
 var cum=0, series=[];
 for(var d=new Date(start); d<=end; d.setDate(d.getDate()+1)){ var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); var per=map[k]||0; cum+=per; series.push({k:k,per:per,cum:cum,label:('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)}); }
 var W=800,H=220,pad=10,bottom=8;
 var maxCum=series[series.length-1].cum||1, maxPer=Math.max.apply(null,series.map(function(s){return s.per;}))||1;
 var n=series.length, bw=Math.max(2,(W-pad*2)/n*0.55);
 var bars='', line='', area='', pts=[];
 series.forEach(function(s,i){
  var x=pad+(W-pad*2)*(n===1?0.5:i/(n-1));
  var bh=(H-pad-bottom)*(s.per/maxPer);
  var bx=x-bw/2;
  bars+='<rect x="'+bx.toFixed(1)+'" y="'+(H-bottom-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="#93C5FD"/>';
  var y=(H-bottom)-(H-pad-bottom)*(s.cum/maxCum);
  pts.push([x,y]);
 });
 line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 area='M'+pts[0][0].toFixed(1)+' '+(H-bottom)+' '+pts.map(function(p){return 'L'+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ')+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-bottom)+' Z';
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 svg.innerHTML='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563EB" stop-opacity=".18"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>'
  +bars+'<path d="'+area+'" fill="url(#ag)"/><path d="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>'
  +pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="#fff" stroke="var(--brand)" stroke-width="1.5"/>';}).join('');
 // x labels (max ~8)
 var step=Math.ceil(n/8), xl='';
 series.forEach(function(s,i){ if(i%step===0||i===n-1) xl+='<span>'+s.label+'</span>'; });
 el('dchartx').innerHTML=xl;
}

  var itxt=itemKeys.slice(0,2).map(function(p){return esc(shortItem(p))+(c.items[p]>1?(' ×'+c.items[p]):'');}).join('<br>');
  if(itemKeys.length>2)itxt+='<br><span class="psub">+'+(itemKeys.length-2)+'</span>';
  return '<tr><td class="n">'+idx+'</td><td><div class="pname">'+esc(maskName(c.name))+'</div><div class="psub">'+maskPhone(c.phone)+' · '+esc(c.prov)+'</div></td><td><span class="psub">'+esc(c.team||'ไม่มีทีม')+'</span></td><td style="font-size:.8rem">'+itxt+'</td><td class="n">'+num(c.pieces)+'</td><td class="n">'+num(c.orders)+'</td><td class="n"><b>'+baht(c.amt)+'</b></td><td><span class="st '+c.status+'">'+(ST_LABEL[c.status]||'หลายสถานะ')+'</span></td></tr>';
 }).join('');
 return '<div class="sec"><h2>รายชื่อลูกค้าทั้งหมด <span class="stamp">'+num(data.length)+' คน</span></h2>'
  +'<div class="card panel">'
  +'<div class="selrow">'
   +'<select class="f" onchange="custFilters.team=this.value;custPage=1;render()">'+teamOpts+'</select>'
   +'<select class="f" onchange="custFilters.status=this.value;custPage=1;render()">'+statusOpts+'</select>'
   +'<select class="f" onchange="custFilters.product=this.value;custPage=1;render()">'+prodOpts+'</select>'
  +'</div>'
  +'<div style="color:var(--sub);font-size:.83rem;margin-bottom:6px">แสดง '+num(filtered.length)+' คน · '+num(totPieces)+' ชิ้น · มูลค่ารวม '+baht(totAmt)+'</div>'
  +'<div class="twrap"><table><thead><tr><th class="n">#</th><th>ลูกค้า</th><th>ทีม</th><th>รายการที่ซื้อ</th><th class="n">ชิ้น</th><th class="n">ออเดอร์</th><th class="n">มูลค่า</th><th>สถานะ</th></tr></thead><tbody>'+(body||'<tr><td colspan=8 class=center>ไม่พบลูกค้าตามเงื่อนไข</td></tr>')+'</tbody></table></div>'
  +pager(custPage,pages,'custPage')
  +'<p class="priv">แสดงชื่อย่อและเบอร์ 4 ตัวท้ายเพื่อคุ้มครองข้อมูลส่วนบุคคล (PDPA) · ทีมดึงจากช่อง “ผู้แนะนำ/ทีมโค้ช” ในออเดอร์</p></div></div>';
}
function shortItem(nm){ return String(nm).replace('TRIPLE SET','Triple').replace('DUO SET','Duo').replace('TWIN SET','Twin').replace('Xircle Band','Band').replace('Xircle Scale','Scale').replace(' · ',' '); }

/* ================= REFERRERS ================= */
function referrerSection(A){
 var refs=Object.keys(A.ref).map(function(name){var v=A.ref[name];var ti=tier(v.amt);return {name:name,n:v.n,amt:v.amt,tier:ti.t,comm:v.amt*ti.r};}).sort(function(a,b){return b.amt-a.amt;});
 var totComm=refs.reduce(function(s,r){return s+r.comm;},0);
 var totOrders=refs.reduce(function(s,r){return s+r.n;},0);
 var pages=Math.max(1,Math.ceil(refs.length/PAGE_REF)); if(refPage>pages)refPage=pages;
 var slice=refs.slice((refPage-1)*PAGE_REF, refPage*PAGE_REF);
 var body=slice.map(function(r,i){var idx=(refPage-1)*PAGE_REF+i+1;
  return '<div class="li"><div class="rank">'+idx+'</div><div class="body"><div class="t">'+esc(r.name)+'</div><div class="s">Tier '+r.tier+'</div></div>'
   +'<div class="amt" style="min-width:70px">'+num(r.n)+'<small>ออเดอร์</small></div>'
   +'<div class="amt" style="min-width:96px">'+baht(r.amt)+'<small>ยอดขาย</small></div>'
   +'<div class="amt" style="min-width:90px;color:var(--good)">'+baht(r.comm)+'<small>ค่าคอม</small></div></div>';
 }).join('');
 return '<div class="sec"><h2>ผู้แนะนำทั้งหมด <span class="stamp">'+num(refs.length)+' คน · '+num(totOrders)+' ออเดอร์</span></h2>'
  +'<div class="card panel">'+(body||'<div class="center">ยังไม่มีข้อมูลผู้แนะนำ</div>')+pager(refPage,pages,'refPage')
  +'<p class="priv">ประมาณการค่าคอมรวม '+baht(totComm)+' · คำนวณตามขั้นบันได 20/23/25% จากยอดสะสมของแต่ละคน (ค่าประมาณ) · แสดงเฉพาะออเดอร์ที่มีผู้แนะนำ</p></div></div>';
}

/* ================= PROVINCES ================= */
function provinceSection(A){
 var arr=Object.keys(A.prov).map(function(p){return {p:p,n:A.prov[p]};}).sort(function(a,b){return b.n-a.n;});
 var pages=Math.max(1,Math.ceil(arr.length/PAGE_PROV)); if(provPage>pages)provPage=pages;
 var slice=arr.slice((provPage-1)*PAGE_PROV, provPage*PAGE_PROV);
 var max=arr.length?arr[0].n:1;
 var body=slice.map(function(r,i){var idx=(provPage-1)*PAGE_PROV+i+1;var p=Math.max(4,Math.round(r.n/max*100));
  return '<div class="li"><div class="rank">'+idx+'</div><div class="body"><div class="t">'+esc(r.p)+'</div><div class="track" style="margin-top:6px"><b style="width:'+p+'%;background:var(--pink)"></b></div></div><div class="amt">'+num(r.n)+'<small>ราย</small></div></div>';
 }).join('');
 return '<div class="sec"><h2>ปลายทางจัดส่ง <span class="stamp">'+num(arr.length)+' จังหวัด</span></h2><div class="card panel">'+(body||'<div class="center">—</div>')+pager(provPage,pages,'provPage')+'</div></div>';
}

/* ================= CEO SUMMARY (รายงานผู้บริหาร) ================= */
function segValue(o){
 if(SEG==='day'){ var d=new Date(o.at); if(isNaN(d))return 'ไม่ระบุ'; return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2); }
 if(SEG==='team'){ var r=(o.team||'').trim(); if(!r){ var rf=(o.ref||'').trim(); if(rf){ var parts=rf.split('·'); r=(parts[1]||parts[0]||'').trim(); } } return r?maskName(r.replace(/[0-9]{3,}/g,'').trim()):'ไม่ระบุ'; }
 if(SEG==='xvisor'){ return (o.xvisor||'').trim()||'ไม่ระบุ'; }
 if(SEG==='channel'){ return (o.channel||'').trim()||'ไม่ระบุ'; }
 if(SEG==='campaign'){ return (o.campaign||'').trim()||'ไม่ระบุ'; }
 return 'ไม่ระบุ';
}
function isDelivered(o){ return !!(o.delivered||o.deliveredAt); }
function isRefund(o){ return o.status==='refunded'||!!o.refunded; }
function ceoSection(A){
 var delivered=0, refundN=0, refundAmt=0;
 VIEW.forEach(function(o){ if(isDelivered(o))delivered++; if(isRefund(o)){refundN++;refundAmt+=(Number(o.total)||0);} });
 function tile(lb,v,sub,cls){ return '<div class="card kpi"><div class="lb" style="color:var(--sub);font-size:.8rem;font-weight:600;margin-bottom:6px">'+lb+'</div><div class="v num" style="font-size:1.5rem">'+v+'</div><div class="d '+(cls||'')+'">'+sub+'</div></div>'; }
 var tiles='<div class="grid g4 mb">'
  +tile('Order (คำสั่งซื้อ)',num(A.n),num(A.sets)+' ที่ยังอยู่ · '+num(A.pieces)+' ชิ้น')
  +tile('Customer (ลูกค้า)',num(A.uniqueBuyers),'ซื้อซ้ำ '+num(A.repeatBuyers)+' คน')
  +tile('Revenue (ยอดขาย)',baht(A.sales),'เก็บเงินได้ '+baht(A.paidAmt),'up')
  +tile('Package (แพ็กเกจ)',num(A.sets),num(A.family)+' สิทธิ์ Family')
  +tile('Payment (ชำระแล้ว)',num(A.paidN),pct(A.paidN,A.n)+'% · รอ '+num(A.pendN),'up')
  +tile('Delivered (จัดส่งแล้ว)',num(delivered),delivered?'':'ยังไม่เก็บสถานะจัดส่ง')
  +tile('Cancel (ยกเลิก)',num(A.cancN),baht(A.cancAmt),A.cancN?'down':'')
  +tile('Refund (คืนเงิน)',num(refundN),refundN?baht(refundAmt):'ยังไม่มีการคืนเงิน',refundN?'down':'')
  +'</div>';
 var dims=[['day','วัน'],['team','ทีม'],['xvisor','X-Visor'],['channel','Channel'],['campaign','Campaign']];
 var picker='<select class="f" onchange="setSeg(this.value)" style="font-weight:700;color:var(--brand)">'+dims.map(function(d){return '<option value="'+d[0]+'"'+(SEG===d[0]?' selected':'')+'>'+d[1]+'</option>';}).join('')+'</select>';
 var groups={};
 VIEW.forEach(function(o){ var k=segValue(o); if(!groups[k])groups[k]={orders:0,cust:{},rev:0,deliv:0,cancel:0,refund:0}; var g=groups[k];
   var b=bucket(o); g.orders++; g.cust[o.phone||o.name||o.id]=1;
   if(b==='paid'||b==='pending')g.rev+=(Number(o.total)||0);
   if(isDelivered(o))g.deliv++; if(b==='cancel')g.cancel++; if(isRefund(o))g.refund++;
 });
 var keys=Object.keys(groups);
 keys.sort(function(a,b){ if(SEG==='day')return a<b?1:-1; return groups[b].rev-groups[a].rev; });
 var noData=(keys.length===1 && keys[0]==='ไม่ระบุ');
 var rows=keys.slice(0,SEG==='day'?15:30).map(function(k){var g=groups[k];
   return '<tr><td><b>'+esc(k)+'</b></td><td class="n">'+num(g.orders)+'</td><td class="n">'+num(Object.keys(g.cust).length)+'</td><td class="n"><b>'+baht(g.rev)+'</b></td><td class="n">'+num(g.deliv)+'</td><td class="n" style="color:var(--bad)">'+num(g.cancel)+'</td><td class="n">'+num(g.refund)+'</td></tr>';
 }).join('');
 var dimLabel=(dims.filter(function(d){return d[0]===SEG;})[0]||['','กลุ่ม'])[1];
 var note = noData ? '<div class="note amber" style="margin:0 0 12px">มิติ “'+dimLabel+'” ยังไม่ได้เก็บข้อมูลในออเดอร์ชุดนี้ — ตัวเลขจะขึ้นเมื่อออเดอร์ใหม่บันทึกฟิลด์นี้ (เพิ่มช่องเก็บได้ในหน้าสั่งซื้อ/Operations)</div>' : '';
 var seg='<div class="card panel">'
   +'<div class="ph"><h3>แบ่งตาม</h3>'+picker+'</div>'+note
   +'<div class="twrap"><table><thead><tr><th>'+dimLabel+'</th><th class="n">Order</th><th class="n">Customer</th><th class="n">Revenue</th><th class="n">Delivered</th><th class="n">Cancel</th><th class="n">Refund</th></tr></thead><tbody>'+(rows||'<tr><td colspan=7 class=center>—</td></tr>')+'</tbody></table></div></div>';
 return '<div class="sec"><h2>รายงานผู้บริหาร (CEO Summary) <span class="stamp">สำหรับช่วง Launch</span></h2>'+tiles+seg+'</div>';
}

/* ================= PAGER ================= */
function pager(cur,pages,varName){
 if(pages<=1)return '';
 var h='<div class="pager"><button '+(cur<=1?'disabled':'')+' onclick="'+varName+'=Math.max(1,'+varName+'-1);render()">‹</button>';
 var show=[]; for(var i=1;i<=pages;i++){ if(i<=2||i>pages-2||Math.abs(i-cur)<=1)show.push(i); else if(show[show.length-1]!=='…')show.push('…'); }
 show.forEach(function(i){ if(i==='…')h+='<button disabled>…</button>'; else h+='<button class="'+(i===cur?'on':'')+'" onclick="'+varName+'='+i+';render()">'+i+'</button>'; });
 h+='<button '+(cur>=pages?'disabled':'')+' onclick="'+varName+'=Math.min('+pages+','+varName+'+1);render()">›</button></div>';
 return h;
}

loadData();
</script>
</body>
</html>
