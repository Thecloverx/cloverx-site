<title>CloverX Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#EEF2F8;--panel:#FFFFFF;--ink:#1E2A44;--muted:#6B7793;--line:#E7ECF4;--soft:#F5F8FC;
    --brand:#2563EB;--brand-tint:#E7EFFF;--brand-ink:#1B49C7;
    --good:#12A67C;--good-tint:#E5F6EF;--warn:#D98A1A;--warn-tint:#FFF3E0;--bad:#E5484D;--bad-tint:#FDECEC;
    --lean:#16A34A;--lean-tint:#E7F7EC;
    --radius:14px;color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .num{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}

  /* SIDEBAR */
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .brand .bmark{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex:none}
  .brand .btext{display:flex;flex-direction:column;min-width:0}
  .brand .logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:1.32rem;letter-spacing:.04em}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:600;margin-top:4px;white-space:nowrap}
  .wsbadge{margin:14px 16px 6px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
  .wsbadge .ic{width:34px;height:34px;border-radius:9px;background:#0EA5E9;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .wsbadge b{font-size:.92rem}.wsbadge span{display:block;font-size:.72rem;color:var(--muted)}
  .nav{padding:8px 10px 12px;display:flex;flex-direction:column;gap:1px;flex:1;overflow:auto}
  .nav .item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;color:var(--ink);font-weight:600;font-size:.88rem;cursor:pointer;transition:.14s;border:0;background:none;width:100%;text-align:left;font-family:inherit;position:relative}
  .nav .item svg.i{width:18px;height:18px;flex:none;color:var(--muted)}
  .nav .item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav .item:hover{background:var(--soft)}
  .nav .item.active{background:var(--brand-tint);color:var(--brand);font-weight:700;box-shadow:inset 2.5px 0 0 var(--brand)}
  .nav .item.active svg.i{color:var(--brand)}
  .nav .item .soon{font-size:.62rem;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:auto}
  .nav .group{margin-top:5px}
  .nav .group:first-child{margin-top:0}
  .nav .ghead{font-size:.72rem;font-weight:800;letter-spacing:.03em;color:var(--muted)}
  .nav .ghead svg.i{width:16px;height:16px}
  .nav .ghead:hover{background:var(--soft);color:var(--ink)}
  .nav .item .caret{margin-left:auto;transition:transform .18s;color:var(--muted);flex:none;opacity:.7}
  .nav .group.open>.ghead .caret{transform:rotate(90deg)}
  .nav .children{display:none;flex-direction:column;gap:1px;margin:1px 0 2px}
  .nav .group.open>.children{display:flex}
  .nav .children .item{font-weight:600;padding-left:38px;font-size:.86rem;color:var(--ink)}
  .nav .children .item.lvl2{padding-left:16px;font-size:.82rem;font-weight:800;color:var(--ink)}
  .nav .children .item.lvl3{padding-left:34px;font-size:.85rem}
  .nav .children .item.ghead.lvl3{font-weight:700}
  .nav .children .item.lvl4{padding-left:52px;font-size:.84rem}
  .nav .children .group{margin-top:1px}
  .nav .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
  .nav .navfoot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
  .nav .navfoot .item{margin-top:2px}

  /* collapsible icon-rail (desktop) */
  @media(min-width:901px){
    .app{grid-template-columns:74px 1fr}
    .side{width:74px;overflow:visible;z-index:45;transition:width .22s cubic-bezier(.4,0,.2,1)}
    .side.expanded{width:262px;box-shadow:16px 0 44px -20px rgba(15,23,42,.30)}
    .side:not(.expanded) .brand{justify-content:center;padding:16px 0}
    .side:not(.expanded) .btext{display:none}
    .side:not(.expanded) .wsbadge{margin:12px auto 6px;padding:8px;justify-content:center}
    .side:not(.expanded) .wsbadge>div{display:none}
    .side:not(.expanded) .nav .item{justify-content:center;padding:9px 0;gap:0}
    .side:not(.expanded) .nav .item .lbl,.side:not(.expanded) .nav .item .caret,.side:not(.expanded) .nav .item .soon{display:none}
    .side:not(.expanded) .nav .children{display:none!important}
    .side:not(.expanded) .nav .group.has-active>.ghead{background:var(--brand-tint);color:var(--brand)}
    .side:not(.expanded) .nav .group.has-active>.ghead svg.i{color:var(--brand)}
    .side .nav{overflow-y:auto;overflow-x:hidden}
  }
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .22s}
    .side.open{transform:none}
    .burger{display:block}
    .scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;display:none}
    .scrim.show{display:block}
  }
  .scrim{display:none}

  /* MAIN */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;height:70px}
  .burger{display:none;background:none;border:0;cursor:pointer;color:var(--ink)}
  .crumb{font-size:.82rem;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:700;font-size:1.02rem;display:block}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .user{display:flex;align-items:center;gap:10px}
  .user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#38BDF8,#0369A1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
  .user .info b{font-size:.88rem}.user .info span{display:block;font-size:.74rem;color:var(--muted)}
  @media(max-width:560px){.user .info{display:none}}

  .content{padding:26px;flex:1}
  .wrapc{max-width:1200px;margin:0 auto}
  .head{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .head h1{font-size:1.6rem;display:flex;align-items:center;gap:10px}
  .head p{color:var(--muted);margin-top:4px;font-size:.95rem}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;border:1px solid;text-decoration:none;transition:.15s}
  .btn.pri{background:var(--lean);border-color:var(--lean);color:#fff}
  .btn.pri:hover{filter:brightness(.95)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{background:var(--soft)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:16px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .kpi .lb{font-size:.85rem;color:var(--muted)}
  .kpi .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .kpi .s{font-size:.76rem;color:var(--muted);margin-top:4px}
  @media(max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px}
  .panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .panel h3{font-size:1.05rem}
  .pill{font-size:.74rem;font-weight:700;padding:4px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .pill.ok{background:var(--good-tint);color:var(--good)}
  .pill.lean{background:var(--lean-tint);color:var(--lean)}
  .pill.pend{background:var(--warn-tint);color:var(--warn)}
  .pill.bad{background:var(--bad-tint);color:var(--bad)}
  .pill.new{background:var(--brand-tint);color:var(--brand-ink)}

  /* data table */
  table{width:100%;border-collapse:collapse;font-size:.875rem}
  table thead th{text-align:left;font-weight:700;color:var(--muted);font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;padding:0 18px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;vertical-align:bottom}
  table tbody td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink);line-height:1.45}
  table tbody tr:last-child td{border-bottom:0}
  table tbody tr:hover td{background:var(--soft)}
  table tbody td:first-child{border-radius:10px 0 0 10px}
  table tbody td:last-child{border-radius:0 10px 10px 0}
  table .cell-amt{font-weight:800;font-size:.95rem;white-space:nowrap;font-variant-numeric:tabular-nums}
  table .cell-sub{font-size:.72rem;color:var(--muted);margin-top:3px}
  table .acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  table .acts .btn{padding:7px 13px;font-size:.8rem;border-radius:9px}
  table .acts .btn.icon{padding:7px 9px}
  .linkpill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:8px;text-decoration:none;white-space:nowrap;margin:2px 4px 2px 0}
  .linkpill.slip{background:var(--brand-tint);color:var(--brand-ink)}
  .linkpill.proof{background:var(--warn-tint);color:var(--warn)}
  .linkpill.before{background:var(--good-tint);color:var(--good)}

  /* embedded system frame */
  .frame{width:100%;height:760px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--soft)}
  .frame iframe{width:100%;height:100%;border:0;display:block}
  .framebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .framebar .u{font-size:.78rem;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-family:ui-monospace,monospace}

  .ph-empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:44px;text-align:center;color:var(--muted)}
  .ph-empty .ic{width:60px;height:60px;border-radius:16px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .ph-empty h3{color:var(--ink);font-size:1.2rem;margin-bottom:6px}
  .view{display:none}.view.active{display:block}
</style>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <a class="brand" href="center.html" title="กลับ CloverX Center">
      <span class="bmark">C</span>
      <span class="btext"><span class="logo">CLOVER</span><small>One Platform, All Departments</small></span>
    </a>
    <div class="wsbadge">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14a2 2 0 0 0 2 2h1v-5H6a2 2 0 0 0-2 2zM20 14a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2zM17 16v1a3 3 0 0 1-3 3h-2"/></svg></span>
      <div><b>ฝ่ายซัพพอร์ต</b><span>Support</span></div>
    </div>
    <nav class="nav" id="nav">
      <!-- Event Management -->
      <div class="group open" id="g-event">
        <button class="item ghead" data-toggle="g-event"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="lbl">Event Management</span><svg class="caret" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
        <div class="children">
          <div class="group open" id="g-ll">
            <button class="item ghead lvl2" data-toggle="g-ll"><span class="dot"></span><span class="lbl">Lean Lab</span><svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            <div class="children">
              <button class="item lvl3 active" data-view="lldash"><span class="dot"></span><span class="lbl">Dashboard</span></button>
              <div class="group open" id="g-mem">
                <button class="item ghead lvl3" data-toggle="g-mem"><span class="dot"></span><span class="lbl">Member</span><svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
                <div class="children">
                  <button class="item lvl4" data-view="llmstart"><span class="dot"></span><span class="lbl">Start Member</span></button>
                  <button class="item lvl4" data-view="llmafter"><span class="dot"></span><span class="lbl">After Member</span></button>
                  <button class="item lvl4" data-view="llreg"><span class="dot"></span><span class="lbl">Registration</span></button>
                </div>
              </div>
              <div class="group open" id="g-order">
                <button class="item ghead lvl3" data-toggle="g-order"><span class="dot"></span><span class="lbl">Order</span><svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
                <div class="children">
                  <button class="item lvl4" data-view="llorder"><span class="dot"></span><span class="lbl">Management</span></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="navfoot">
        <button class="item" data-view="settings"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 0 1 4 0v.1A1.6 1.6 0 0 0 17 2.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span class="lbl">ตั้งค่า</span></button>
      </div>
    </nav>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide()"></div>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="burger" onclick="toggleSide()" aria-label="เมนู"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb">ฝ่ายซัพพอร์ต<b id="crumbTitle">Lean Lab</b></div>
      <div class="right">
        <div class="user"><div class="av">S</div><div class="info"><b>Support</b><span>CloverX</span></div></div>
      </div>
    </header>

    <div class="content"><div class="wrapc" id="gen"></div></div>
  </div>
</div>

<script>
  var gen=document.getElementById('gen');
  function toggleSide(){document.getElementById('side').classList.toggle('open');document.getElementById('scrim').classList.toggle('show');}

  // desktop icon-rail: expand on hover
  (function(){var s=document.getElementById('side');
    s.addEventListener('mouseenter',function(){if(window.innerWidth>900)s.classList.add('expanded');});
    s.addEventListener('mouseleave',function(){s.classList.remove('expanded');});
  })();

  // group collapse toggles
  document.querySelectorAll('[data-toggle]').forEach(function(b){b.addEventListener('click',function(){
    document.getElementById(b.getAttribute('data-toggle')).classList.toggle('open');
  });});

  var TITLES={lldash:'Dashboard',llreg:'Registration',llmstart:'Start Member',llmafter:'After Member',llorder:'Order · Management',settings:'ตั้งค่า'};

  // ---------- DASHBOARD (Lean Lab event overview) ----------
  function dashView(){
    return '<div class="head"><div><h1><span class="pill lean">EVENT</span> Dashboard — Lean Lab</h1>'
      + '<p>ภาพรวมผู้สมัคร การชำระเงิน และสัดส่วน · Season 1 · เป้าหมาย 300 คน</p></div>'
      + '<div style="display:flex;gap:10px"><button class="btn ghost" id="dashRefresh">รีเฟรช ⟳</button><a class="btn pri" href="/leanlab" target="_blank" rel="noopener">เปิดหน้าลูกค้า ↗</a></div></div>'
      + '<div id="dashBody"><div style="text-align:center;color:var(--muted);padding:52px 0">กำลังโหลดข้อมูล…</div></div>';
  }
  function dbar(label,value,max,color,suffix){
    var pct=max>0?Math.round(value/max*100):0;
    return '<div style="display:flex;align-items:center;gap:12px;margin:10px 0">'
      + '<div style="width:180px;font-size:.85rem;color:var(--ink);flex:none">'+label+'</div>'
      + '<div style="flex:1;min-width:60px;height:20px;background:var(--soft);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+color+';min-width:3px"></div></div>'
      + '<div class="num" style="width:78px;text-align:right;font-weight:800;font-size:.92rem">'+value+(suffix||'')+'</div></div>';
  }
  function dashLoad(){
    var rb=document.getElementById('dashRefresh'); if(rb)rb.onclick=dashLoad;
    fetch('/api/leanlab/admin/registrations',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
      var body=document.getElementById('dashBody'); if(!body)return;
      if(!j||!j.ok){body.innerHTML='<div style="color:var(--bad);text-align:center;padding:40px">โหลดข้อมูลไม่สำเร็จ</div>';return;}
      var R=j.registrations||[], TARGET=300, promo=j.promo||{quota:100,used:0,left:100};
      var total=R.length;
      var confirmed=R.filter(function(x){return x.status==='confirmed';});
      var pending=R.filter(function(x){return x.status==='pending_review'||x.status==='promo_review';}).length;
      var pastdue=R.filter(function(x){return x.installment&&x.installment.status==='past_due';}).length;
      var received=0, projected=0;
      confirmed.forEach(function(x){ if(x.installment){received+=(x.installment.perMonth||0)*(x.installment.paidCount||0);projected+=(x.installment.total||0);} else {received+=(x.fee||0);projected+=(x.fee||0);} });
      var now=R.filter(function(x){return x.startChoice==='now';}).length;
      var later=R.filter(function(x){return x.startChoice==='later';}).length;
      var std=R.filter(function(x){return !x.promo;}).length;
      var full={t0:0,t1:0,t2:0,t3:0}, special=0;
      R.forEach(function(x){ if(x.promoPlan==='full'&&x.promoTier){full[x.promoTier]=(full[x.promoTier]||0)+1;} else if(x.promoPlan==='special'){special++;} });
      var male=R.filter(function(x){return x.gender==='ชาย';}).length;
      var female=R.filter(function(x){return x.gender==='หญิง';}).length;
      var ab={a:0,b:0,c:0,d:0};
      R.forEach(function(x){var a=Number(x.age); if(!(a>0))return; if(a<=24)ab.a++; else if(a<=34)ab.b++; else if(a<=44)ab.c++; else ab.d++;});
      var pctT=Math.min(100,Math.round(total/TARGET*100));
      var mPay=Math.max(std,full.t0,full.t1,full.t2,full.t3,special,1);
      var mAge=Math.max(ab.a,ab.b,ab.c,ab.d,1), mG=Math.max(male,female,1), mS=Math.max(now,later,1);
      var pctOf=function(n){return total?Math.round(n/total*100):0;};
      body.innerHTML=''
        + '<div class="kpis">'

      var tb=document.getElementById('memBody'); if(!tb)return;
      if(!j||!j.ok){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--bad);padding:26px 0">โหลดข้อมูลไม่สำเร็จ</td></tr>';return;}
      var mem=(j.registrations||[]).filter(function(r){return r.status==='confirmed'&&r.startChoice===mode;});
      var cnt=document.getElementById('memCount'); if(cnt)cnt.textContent=mem.length+' คน';
      if(!mem.length){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:26px 0">ยังไม่มีสมาชิกในกลุ่มนี้</td></tr>';return;}
      tb.innerHTML=mem.map(function(r){

        var pkg = ins?('Special · ผ่อน '+Number(ins.perMonth||7490).toLocaleString('en-US')+'×'+(ins.months||6)+' <span style="color:#2E86FF">('+(ins.paidCount||0)+'/'+(ins.months||6)+')</span>')
          : (r.promoPlan==='full'?('Grand Slam · '+(r.promoTier||'')) : 'ค่าสมัครปกติ');
        var amt=ins?(ins.total||44940):(r.fee||0);

          : '<span class="pill ok">เริ่ม 8 พ.ย. 69</span>';

          +'<td style="min-width:170px"><div style="font-weight:700">'+llEsc(r.name||'-')+'</div><div class="cell-sub">'+llEsc(r.email||'')+(r.phone?' · '+llEsc(r.phone):'')+'</div></td>'
          +'<td style="white-space:nowrap;color:var(--muted)">'+llEsc(r.gender||'-')+' · '+llEsc(r.age||'-')+' ปี · '+llEsc(r.heightCm||'-')+' ซม.</td>'
          +'<td style="min-width:150px"><div style="font-weight:600">'+pkg+'</div><div class="cell-amt" style="font-size:.88rem;margin-top:2px">฿'+Number(amt).toLocaleString('en-US')+'</div></td>'
          +'<td style="min-width:120px">'+col4+'</td>'
          +'<td style="white-space:nowrap;color:var(--muted)">'+llEsc((r.reviewedAt||r.createdAt||'').slice(0,10))+'</td>'
          +'</tr>';
      }).join('');
    }).catch(function(){var tb=document.getElementById('memBody');if(tb)tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--bad);padding:26px 0">เชื่อมต่อไม่สำเร็จ</td></tr>';});
  }
  var LL_ST={promo_select:['เลือกโปรฯ','pend'],promo_review:['รอตรวจหลักฐาน','pend'],promo_rejected:['หลักฐานไม่ผ่าน','bad'],awaiting_payment:['รอชำระเงิน','pend'],pending_review:['รอตรวจสลิป','pend'],confirmed:['ยืนยันแล้ว','ok'],rejected:['ปฏิเสธ','bad']};
  function llEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function orderLoad(){
    fetch('/api/leanlab/admin/registrations',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok)return;
      var c=j.counts||{};
      var cnt=document.getElementById('llCount');if(cnt)cnt.textContent=(c.total||0)+' รายการ';
      var tb=document.getElementById('llBody');if(!tb)return;
      var regs=j.registrations||[];
      if(!regs.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:26px 0">ยังไม่มีผู้สมัคร</td></tr>';return;}
      tb.innerHTML=regs.map(function(r){
        var s=LL_ST[r.status]||[r.status,'pend'];
        var start=r.startChoice==='now'?'เริ่มตอนนี้':'8 พ.ย. 2569';
        var base=r.baseline?('<a class="linkpill before" href="'+llEsc(r.baseline.beforePhotoUrl)+'" target="_blank" rel="noopener">ดู Before ↗</a><div class="cell-sub">'+llEsc(r.baseline.weightKg)+'kg · '+llEsc(r.baseline.fatPct)+'% · กล้าม '+llEsc(r.baseline.muscleKg)+'kg</div>'):'<span style="color:var(--muted)">—</span>';
        var slip=r.slipUrl?('<a class="linkpill slip" href="'+llEsc(r.slipUrl)+'" target="_blank" rel="noopener">ดูสลิป ↗</a>'):'';
        var proof=r.promoProofUrl?('<a class="linkpill proof" href="'+llEsc(r.promoProofUrl)+'" target="_blank" rel="noopener">📄 หลักฐาน ↗</a>'):'';
        var TIER={t0:'44,940 (ไม่มีประวัติ)',t1:'39,950',t2:'37,450 (RoutineX)',t3:'32,460 (Brand+Scale+RoutineX)'};
        var ins=r.installment||null;
        var promoInfo;
        if(r.promoPlan==='special'&&ins){
          promoInfo='<div class="cell-sub" style="color:#2563EB">Special · ผ่อน '+Number(ins.perMonth||7490).toLocaleString('en-US')+'×'+(ins.months||6)+' · ตัดทุกวันที่ '+(ins.day||'-')+'</div>';
        } else {
          promoInfo=r.promo?('<div class="cell-sub" style="color:var(--warn)">Grand Slam'+(r.promoTier?(' · '+llEsc(TIER[r.promoTier]||r.promoTier)):'')+'</div>'):'';
        }
        var act='';
        if(r.status==='promo_review'){act+='<button class="btn pri" onclick="llVerify(\''+r.id+'\',\'verified\')">✓ อนุมัติหลักฐาน</button><button class="btn ghost" onclick="llVerify(\''+r.id+'\',\'rejected\')">ปฏิเสธ</button>';}
        if(r.status==='pending_review'||r.status==='rejected'||r.status==='promo_rejected'){act+='<button class="btn pri" onclick="llSet(\''+r.id+'\',\'confirmed\')">ยืนยัน</button>';}
        if(r.status==='pending_review'){act+='<button class="btn ghost" onclick="llSet(\''+r.id+'\',\'rejected\')">ปฏิเสธ</button>';}
        if(r.status==='confirmed'){act+='<button class="btn ghost" onclick="llSet(\''+r.id+'\',\'rejected\')">ยกเลิก</button>';}
        act+='<button class="btn ghost icon" title="ลบ" onclick="llDel(\''+r.id+'\')">🗑</button>';
        var payCell = (r.promoPlan==='special'&&ins)
          ? ('<div class="cell-amt">฿'+Number(ins.total||44940).toLocaleString('en-US')+'</div><div class="cell-sub" style="color:#2563EB">ผ่อนบัตร '+(ins.paidCount||0)+'/'+(ins.months||6)+' งวด</div>'+(ins.status?'<div class="cell-sub">'+llEsc(ins.status==='completed'?'ครบแล้ว ✓':ins.status==='past_due'?'⚠ ตัดไม่ผ่าน':ins.status==='active'?'กำลังผ่อน':ins.status)+'</div>':'')+(ins.lastFail?'<div class="cell-sub" style="color:var(--bad)">ตัดไม่ผ่าน '+llEsc((ins.lastFail.at||'').slice(0,10))+'</div>':''))
          : ('<div class="cell-amt">฿'+Number(r.fee||0).toLocaleString('en-US')+'</div><div class="cell-sub">โอนธนาคาร</div>'+(slip||proof?('<div style="margin-top:6px;display:flex;flex-wrap:wrap">'+slip+proof+'</div>'):'<div class="cell-sub" style="color:var(--muted)">ยังไม่แนบ</div>'));
        return '<tr>'
          +'<td style="min-width:180px"><div style="font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+llEsc(r.name||'-')+(r.promo?'<span class="pill pend" style="font-size:.64rem;padding:2px 8px">🎁 โปรโมชั่น</span>':'')+'</div><div class="cell-sub">'+llEsc(r.email||'')+(r.phone?' · '+llEsc(r.phone):'')+'</div></td>'
          +'<td style="white-space:nowrap;color:var(--muted)">'+llEsc(r.gender||'-')+' · '+llEsc(r.age||'-')+' ปี · '+llEsc(r.heightCm||'-')+' ซม.</td>'
          +'<td style="min-width:150px"><span class="pill '+(r.startChoice==='now'?'lean':'ok')+'">'+start+'</span>'+promoInfo+'</td>'
          +'<td style="min-width:120px">'+base+'</td>'
          +'<td style="min-width:130px">'+payCell+'</td>'
          +'<td><span class="pill '+s[1]+'">'+s[0]+'</span></td>'
          +'<td><div class="acts">'+(act||'<span style="color:var(--muted)">—</span>')+'</div></td>'
          +'</tr>';
      }).join('');
    }).catch(function(){var tb=document.getElementById('llBody');if(tb)tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--bad);padding:26px 0">โหลดข้อมูลไม่สำเร็จ</td></tr>';});
  }
  window.llDel=function(id){
    if(!confirm('ลบผู้สมัครนี้ถาวร? (รวมบัญชีสมาชิก)'))return;
    fetch('/api/leanlab/admin/registration/'+encodeURIComponent(id)+'/delete',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({withMember:true})})
      .then(function(r){return r.json();}).then(function(j){if(j&&j.ok)orderLoad();else alert('ลบไม่สำเร็จ');})
      .catch(function(){alert('เชื่อมต่อไม่สำเร็จ');});
  };
  window.llVerify=function(id,result){
    if(result==='rejected'&&!confirm('ปฏิเสธหลักฐานการซื้อของผู้สมัครนี้?'))return;
    fetch('/api/leanlab/admin/registration/'+encodeURIComponent(id)+'/promo-verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({result:result})})
      .then(function(r){return r.json();}).then(function(j){if(j&&j.ok)orderLoad();else alert('อัปเดตไม่สำเร็จ');})
      .catch(function(){alert('เชื่อมต่อไม่สำเร็จ');});
  };
  window.llSet=function(id,status){
    if(status==='rejected'&&!confirm('ยืนยันการปฏิเสธ/ยกเลิกผู้สมัครนี้?'))return;
    fetch('/api/leanlab/admin/registration/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({status:status})})
      .then(function(r){return r.json();}).then(function(j){if(j&&j.ok)orderLoad();else alert('อัปเดตไม่สำเร็จ');})
      .catch(function(){alert('เชื่อมต่อไม่สำเร็จ');});
  };

  function emptyView(title,desc){
    return '<div class="head"><h1>'+title+'</h1></div>'
      + '<div class="ph-empty"><div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4M12 16h.01M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg></div>'
      + '<h3>'+title+'</h3><p>'+desc+'</p></div>';
  }

  function go(v){
    document.querySelectorAll('.nav .item[data-view]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===v);});
    // mark group has-active for collapsed rail
    document.querySelectorAll('.nav .group').forEach(function(g){g.classList.toggle('has-active', !!g.querySelector('.item.active'));});
    document.getElementById('crumbTitle').textContent=TITLES[v]||v;
    if(v==='lldash'){ gen.innerHTML=dashView(); dashLoad(); }
    else if(v==='llreg'){ gen.innerHTML=registerView(); registerInit(); }
    else if(v==='llmstart'){ gen.innerHTML=memberView('now'); memberLoad('now'); }
    else if(v==='llmafter'){ gen.innerHTML=memberView('later'); memberLoad('later'); }
    else if(v==='llorder'){ gen.innerHTML=orderView(); orderInit(); }
    else if(v==='tickets') gen.innerHTML=emptyView('Tickets','ระบบรับเรื่อง/ตั๋วช่วยเหลือลูกค้า กำลังพัฒนา — เร็ว ๆ นี้');
    else if(v==='kb') gen.innerHTML=emptyView('ฐานความรู้','คลังบทความ/คู่มือช่วยเหลือ กำลังพัฒนา — เร็ว ๆ นี้');
    else if(v==='settings') gen.innerHTML=emptyView('ตั้งค่า','ตั้งค่าฝ่ายซัพพอร์ต กำลังพัฒนา — เร็ว ๆ นี้');
    else gen.innerHTML=emptyView(TITLES[v]||v,'กำลังพัฒนา');
    if(window.innerWidth<=900){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('show');}
    window.scrollTo(0,0);
  }
  document.querySelectorAll('.nav .item[data-view]').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-view'));});});

  go('lldash');
</script>
