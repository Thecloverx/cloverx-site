<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X-VISOR — ระบบสอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --background:#F4F9FF;--surface:rgba(255,255,255,0.76);--surface-solid:#FFFFFF;
  --primary-500:#1478FF;--primary-600:#075BFF;--primary-700:#0649D8;--cyan-400:#27C8FF;
  --text-primary:#092A64;--text-secondary:#526987;--border:rgba(45,136,255,0.18);
  --success:#14A66D;--warning:#F59E0B;--danger:#E5484D;
  --radius-card:24px;--radius-control:14px;--radius-pill:999px;
  --shadow-card:0 12px 35px rgba(45,109,190,0.10),inset 0 1px 0 rgba(255,255,255,0.90);
  --glow-primary:0 0 0 1px rgba(39,200,255,0.22),0 0 24px rgba(20,120,255,0.14);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --font:"IBM Plex Sans Thai","Manrope",system-ui,sans-serif;--num:"Manrope","IBM Plex Sans Thai",sans-serif;
  --grad-primary:linear-gradient(135deg,var(--cyan-400) -30%,var(--primary-500) 42%,var(--primary-600) 108%);
  --grad-danger:linear-gradient(135deg,#ff8a8d -10%,var(--danger) 60%,#c93b40 120%);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--text-primary);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:radial-gradient(1100px 520px at 88% -12%,rgba(39,200,255,0.12),transparent 60%),radial-gradient(820px 480px at -5% -8%,rgba(20,120,255,0.10),transparent 58%),var(--background);
  background-attachment:fixed;min-height:100%}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font-family:inherit}svg{display:block}
input{font-family:inherit}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:.4}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes orbit{to{stroke-dashoffset:-402.1}}
@keyframes orbitSm{to{stroke-dashoffset:-289.0}}
@keyframes bloom{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes neonBreath{0%,100%{opacity:.92}50%{opacity:1}}
@keyframes cometPulse{0%,100%{transform:scale(.75);opacity:.85}50%{transform:scale(1.3);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes livedot{0%{box-shadow:0 0 0 0 rgba(20,166,109,.45)}70%,100%{box-shadow:0 0 0 7px rgba(20,166,109,0)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shine{0%{transform:translateX(-170%) skewX(-20deg)}20%,100%{transform:translateX(360%) skewX(-20deg)}}
@keyframes shineOnce{0%{transform:translateX(-170%) skewX(-20deg)}100%{transform:translateX(360%) skewX(-20deg)}}
@keyframes glowPulseP{0%,100%{box-shadow:0 0 0 1px rgba(39,200,255,.32),0 0 18px rgba(39,200,255,.22),0 12px 24px -12px rgba(7,91,255,.55)}50%{box-shadow:0 0 0 1px rgba(39,200,255,.5),0 0 26px rgba(39,200,255,.4),0 12px 26px -12px rgba(7,91,255,.62)}}
@keyframes miPulse{0%,100%{box-shadow:0 8px 18px -8px rgba(7,91,255,.6),0 0 0 0 rgba(39,200,255,.5)}50%{box-shadow:0 8px 18px -8px rgba(7,91,255,.6),0 0 0 8px rgba(39,200,255,0)}}
@keyframes scan{0%{top:16%;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:80%;opacity:0}}

/* ---------- primitives ---------- */
.card{position:relative;background:var(--surface);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);border:0;border-radius:var(--radius-pill);cursor:pointer;
  font-family:inherit;font-weight:600;font-size:15px;padding:13px var(--space-5);transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .2s;white-space:nowrap;position:relative;overflow:hidden}
.btn svg{width:18px;height:18px}
.btn-primary{color:#fff;background:var(--grad-primary);background-size:220% 220%;animation:gradShift 7s ease infinite,glowPulseP 3.4s ease-in-out infinite;text-shadow:0 1px 2px rgba(6,45,120,.35)}
.btn-primary::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:var(--radius-pill);background:linear-gradient(180deg,rgba(255,255,255,.42),transparent);pointer-events:none;z-index:1}
.btn-primary::after{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:26%;pointer-events:none;z-index:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-170%) skewX(-20deg);animation:shine 4.2s ease-in-out infinite}
.btn-primary>*{position:relative;z-index:2}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(39,200,255,.55),0 0 30px rgba(39,200,255,.5),0 16px 34px -12px rgba(7,91,255,.75)}
.btn-primary:hover::after{animation:shineOnce .75s var(--ease)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.btn-primary:disabled{background:linear-gradient(180deg,#a6c8f4,#8fb6ee);color:#fff;box-shadow:0 0 0 1px rgba(39,200,255,.18),inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -12px rgba(45,109,190,.45);cursor:not-allowed;animation:none;text-shadow:none}
.btn-primary:disabled::after{display:none}
.btn-ghost{color:var(--text-primary);background:linear-gradient(180deg,#fff,#f3f8ff);border:1px solid transparent;box-shadow:0 6px 18px -12px rgba(45,109,190,.4)}
.btn-ghost::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;background:linear-gradient(135deg,var(--cyan-400),var(--primary-500) 55%,var(--primary-600));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.45;transition:opacity .25s}
.btn-ghost::after{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:24%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(39,200,255,.4),transparent);transform:translateX(-170%) skewX(-20deg);opacity:0}
.btn-ghost>*{position:relative;z-index:1}
.btn-ghost:hover{transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(45,109,190,.5),0 0 20px rgba(39,200,255,.28)}
.btn-ghost:hover::before{opacity:1}
.btn-ghost:hover::after{opacity:1;animation:shineOnce .7s var(--ease)}
.btn-danger-ghost{color:var(--danger);background:linear-gradient(180deg,#fff,#fff4f4);border:1px solid transparent}
.btn-danger-ghost::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;background:linear-gradient(135deg,#ff9a9d,var(--danger));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;transition:opacity .25s}
.btn-danger-ghost:hover{transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(229,72,77,.5),0 0 16px rgba(229,72,77,.25)}
.btn-danger-ghost:hover::before{opacity:1}
.btn.lg{font-size:16px;padding:15px var(--space-6)}
.btn.block{width:100%}
.chip{width:26px;height:26px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85)}
.slabel{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-secondary);text-transform:uppercase;display:flex;align-items:center;gap:var(--space-2)}
.slabel svg{width:16px;height:16px;color:var(--primary-500)}

/* neon ring (progress + score) */
.ringwrap{position:relative}
.ringwrap::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 56%,rgba(39,200,255,0.20) 74%,rgba(20,120,255,0.05) 84%,transparent 94%);filter:blur(5px);animation:bloom 2.8s ease-in-out infinite}
.ringwrap.danger::before{background:radial-gradient(circle,transparent 56%,rgba(229,72,77,0.20) 74%,rgba(229,72,77,0.05) 84%,transparent 94%)}
.ringwrap svg.ring{position:relative;z-index:1;transform:rotate(-90deg)}
.ringwrap .arc{transition:stroke-dashoffset .8s var(--ease);animation:neonBreath 2.8s ease-in-out infinite}
.ringwrap .spark{animation:orbit 2.6s linear infinite}
.ringwrap .spark.sm{animation:orbitSm 2.4s linear infinite}
.ringwrap .comet{transform-box:fill-box;transform-origin:center;transition:cx .8s var(--ease),cy .8s var(--ease);animation:cometPulse 1.5s ease-in-out infinite}
.ringwrap .rc{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .rc b{font-family:var(--num);font-weight:800;line-height:1;color:var(--text-primary)}
.ringwrap .rc span{font-size:12px;color:var(--text-secondary);margin-top:3px}

/* ---------- app shell ---------- */
.app{max-width:1440px;margin:0 auto;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-5);min-height:100vh}
.app>*{animation:fadeUp .5s var(--ease) both}
.app>*:nth-child(2){animation-delay:.06s}.app>*:nth-child(3){animation-delay:.12s}.app>*:nth-child(4){animation-delay:.18s}

.appbar{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5)}
.brand{font-family:var(--num);font-weight:800;letter-spacing:.14em;font-size:20px;background:var(--grad-primary);-webkit-background-clip:text;background-clip:text;color:transparent}
.appbar .title{font-weight:600;font-size:16px;color:var(--text-primary)}
.appbar .divider{width:1px;height:26px;background:var(--border)}
.appbar .spacer{flex:1}
.appbar .info{display:flex;align-items:center;gap:var(--space-2);font-size:12.5px;color:var(--text-secondary)}
.appbar .info .ii{width:32px;height:32px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;background:#EAF2FF;color:var(--primary-500)}
.appbar .info .ii svg{width:17px;height:17px}
.appbar .info b{display:block;color:var(--text-primary);font-size:13px}
.status{display:inline-flex;align-items:center;gap:var(--space-2);padding:7px var(--space-3);border-radius:var(--radius-pill);background:rgba(20,166,109,0.10);color:var(--success);font-weight:600;font-size:13px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:livedot 2s var(--ease) infinite}
.pill-rem{display:inline-flex;align-items:center;padding:6px 14px;border-radius:var(--radius-pill);background:var(--grad-danger);color:#fff;font-weight:700;font-size:12px;box-shadow:0 8px 18px -10px rgba(229,72,77,.6)}
.timer{display:inline-flex;align-items:center;gap:var(--space-3);padding:8px var(--space-4);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border)}
.timer .clk{width:22px;height:22px;color:var(--primary-500)}
.timer .tlab{font-size:11px;color:var(--text-secondary);line-height:1.15}
.timer .tval{font-family:var(--num);font-weight:800;font-size:20px;color:var(--primary-600)}

/* ---------- exam layout ---------- */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr) 328px;gap:var(--space-5);align-items:start}
.rail{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.rail .rail-title{font-size:13px;font-weight:700}.rail .rail-sub{font-size:11px;letter-spacing:.14em;color:var(--text-secondary);font-weight:600;margin-top:-6px}
.part{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-control);cursor:pointer;border:1px solid transparent;
  transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s,border-color .25s;background:var(--surface-solid)}
.part:hover{border-color:var(--border);transform:translateX(2px)}
.part .pn{width:38px;height:38px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:15px;background:#EAF2FF;color:var(--text-secondary);transition:.25s var(--ease)}
.part .pinfo{flex:1;min-width:0}.part .pinfo b{font-size:14px;font-weight:600;display:block}.part .pinfo span{font-size:12px;color:var(--text-secondary)}
.part.active{background:linear-gradient(135deg,rgba(39,200,255,0.10),rgba(20,120,255,0.10));border-color:rgba(45,136,255,0.28);box-shadow:var(--glow-primary)}
.part.active .pn{background:var(--grad-primary);color:#fff;box-shadow:0 6px 14px -6px rgba(7,91,255,.6)}
.part.active .pinfo b{color:var(--primary-700)}
.part.done .pn{background:rgba(20,166,109,0.14);color:var(--success)}
.part.locked{opacity:.5}
.center{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.qcard{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);min-height:440px}
.qmeta{display:flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--text-secondary);font-weight:600}
.qmeta b{color:var(--primary-600)}.qmeta .sep{width:4px;height:4px;border-radius:50%;background:var(--border)}
.qtext{font-size:19px;font-weight:600;line-height:1.55}
.qbody.swap{animation:fadeUp .32s var(--ease)}
.options{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-1)}
.option{display:flex;align-items:center;gap:var(--space-3);padding:14px var(--space-4);border-radius:var(--radius-control);cursor:pointer;background:var(--surface-solid);border:1px solid var(--border);
  transition:transform .18s var(--ease),box-shadow .25s var(--ease),border-color .2s,background .2s;text-align:left;font-family:inherit;width:100%;position:relative;overflow:hidden}
.option:hover{border-color:rgba(45,136,255,0.45);transform:translateX(3px)}
.option .ol{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:15px;background:#EAF2FF;color:var(--text-secondary);transition:.22s var(--ease)}
.option .otx{flex:1;font-size:15.5px;font-weight:500;transition:color .2s}
.option .ock{width:24px;height:24px;flex:none;color:#fff;opacity:0;transform:scale(.5);transition:.28s var(--ease)}
.option.selected{background:var(--grad-primary);background-size:160% 160%;border-color:transparent;box-shadow:var(--glow-primary),0 14px 28px -14px rgba(7,91,255,0.62)}
.option.selected .otx{color:#fff}.option.selected .ol{background:rgba(255,255,255,0.2);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);transform:scale(1.05)}
.option.selected .ock{opacity:1;transform:scale(1)}
.option.selected::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-140%) skewX(-18deg);animation:sweep .7s var(--ease)}
.navrow{display:flex;align-items:center;gap:var(--space-3)}.navrow .spacer{flex:1}
.side{display:flex;flex-direction:column;gap:var(--space-5)}
.progress-card{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);align-items:center}
.progress-card .slabel{align-self:flex-start}
.progress-card .ringwrap{width:150px;height:150px}
.progress-card .rc b{font-size:34px}
.timeleft{width:100%;display:flex;align-items:center;justify-content:space-between;padding-top:var(--space-3);border-top:1px solid var(--border)}
.timeleft .tl-l{font-size:12.5px;color:var(--text-secondary);font-weight:600}.timeleft .tl-v{font-family:var(--num);font-weight:800;font-size:18px;color:var(--primary-600)}
.sheet-card{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.legend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary)}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal}.legend .ld{width:12px;height:12px;border-radius:4px}
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2)}
/* ยังไม่ตอบ = สีเทา / กำลังทำ = ขอบน้ำเงินพื้นขาว / ตอบแล้ว = น้ำเงินทึบ */
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--num);font-weight:700;font-size:14px;background:#E4EAF3;border:1px solid transparent;color:#93a1b8;transition:transform .16s var(--ease),box-shadow .2s,border-color .2s,background .25s,color .2s}
.cell:hover{border-color:rgba(45,136,255,0.4);color:var(--text-secondary);transform:translateY(-1px)}
.cell.answered{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 6px 14px -8px rgba(7,91,255,.6)}
.cell.answered.justAns{animation:pop .34s var(--ease)}
.cell.current{background:var(--surface-solid);border-color:var(--primary-500);color:var(--primary-600);box-shadow:var(--glow-primary)}
.cell.answered.current{background:var(--grad-primary);color:#fff;box-shadow:0 0 0 2px #fff inset,var(--glow-primary)}
.tabs,.mprogress{display:none}

/* ---------- centered/message screens ---------- */
.wrap-narrow{max-width:760px;margin:0 auto;width:100%}
.wrap-mid{max-width:1080px;margin:0 auto;width:100%}
.hero-h{font-size:clamp(24px,3vw,32px);font-weight:700;text-align:center}
.hero-sub{color:var(--text-secondary);text-align:center;margin-top:6px}

/* registration */
.stepper{display:flex;align-items:center;justify-content:center;gap:var(--space-2);flex-wrap:wrap}
.step{display:flex;align-items:center;gap:var(--space-2);color:var(--text-secondary);font-weight:600;font-size:14px}
.step .sn{width:34px;height:34px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;background:var(--surface-solid);border:1px solid var(--border);color:var(--text-secondary)}
.step.on{color:var(--primary-700)}.step.on .sn{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:var(--glow-primary)}
.step .dash{width:40px;height:2px;background:var(--border);border-radius:2px}
.reg-grid{display:grid;grid-template-columns:1fr 1.05fr .95fr;gap:var(--space-5);align-items:stretch}
.field-title{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:var(--space-3)}
.frow{display:flex;align-items:center;gap:var(--space-3);background:linear-gradient(180deg,#fff,#f6faff);border:1px solid var(--border);border-radius:var(--radius-control);padding:11px var(--space-4);margin-bottom:var(--space-3);transition:box-shadow .22s,border-color .22s}
.frow:focus-within{border-color:rgba(45,136,255,.5);box-shadow:0 0 0 3px rgba(39,200,255,.14),0 0 18px rgba(39,200,255,.2)}
.frow .fi{width:32px;height:32px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e9f3ff,#d4e7ff);color:var(--primary-500);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:.22s}
.frow:focus-within .fi{background:var(--grad-primary);color:#fff;box-shadow:0 4px 12px -5px rgba(7,91,255,.6)}
.frow .fi svg{width:16px;height:16px}
.frow .fc{flex:1;min-width:0}.frow label{display:block;font-size:11.5px;color:var(--text-secondary);font-weight:500}
.frow input{width:100%;border:0;outline:0;background:transparent;font-size:15px;font-weight:600;color:var(--text-primary)}
.frow input::placeholder{color:#9fb0c8;font-weight:400}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);flex:1}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-2);padding:var(--space-4) var(--space-3);
  border-radius:var(--radius-control);cursor:pointer;background:var(--surface-solid);border:1.5px solid var(--border);transition:.2s var(--ease);min-height:150px}
.mode:hover{border-color:rgba(45,136,255,.4);box-shadow:0 10px 24px -16px rgba(45,109,190,.55)}
.mode .mi{width:56px;height:56px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eaf3ff,#d6e8ff);color:var(--primary-500);transition:.25s var(--ease)}
.mode .mi svg{width:26px;height:26px}
.mode .mt{font-weight:700;font-size:16px}.mode .ms{font-size:12px;color:var(--text-secondary)}
.mode .rc2{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:var(--radius-pill);border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;transition:.2s}
.mode .rc2 svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.2s var(--ease)}
.mode.on .rc2 svg{opacity:1;transform:scale(1)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildPaper(parts){parts.forEach(p=>{const src=QBANK[p];const order=shuffle(src.map((_,i)=>i));S.paper[p]=order.map(qi=>{const it=src[qi];const oi=shuffle([0,1,2,3]);return {q:it.q,o:oi.map(k=>it.o[k]),c:oi.indexOf(it.c)};});});}

async function apiGet(p){const r=await fetch(p);if(!r.ok)throw new Error('http'+r.status);return r.json();}

  candidate:{firstName:'',lastName:'',phone:'',mode:'online',cameraConsent:false,id:'660110001'},
  answers:{}, results:Array.from({length:PARTS},(_,i)=>({part:i+1,score:0,status:'pending',attempts:0,wrongIds:[]})),
  remedialQueue:[], staffVerified:false, paper:{},
  round:null, session:null, wrongTab:1};}
/* resolve exam round from ?round=CODE (candidate share link) */
async function resolveRound(){
  let code=null; try{code=new URLSearchParams(location.search).get('round');}catch(e){}
  if(!code)return;
  try{const r=await fetch('/api/xv/round/'+encodeURIComponent(code));const j=await r.json();
    if(j&&j.ok){S.round=j.round;} else {S.round={code,notFound:true};}
  }catch(e){S.round={code,offline:true};}
  if(S.phase==='registration')render();
}
function freshSession(phase){buildPaper(phase==='remedial'?S.remedialQueue:[1,2,3,4,5]);return {phase,remaining:TOTAL,currentPart:phase==='remedial'?S.remedialQueue[0]:1,currentQ:0,pauseUsed:0,shownPct:0};}
function activeParts(){return S.session&&S.session.phase==='remedial'?S.remedialQueue.slice():[1,2,3,4,5];}
function partAnswered(p){let n=0;for(let q=0;q<QPP;q++)if(S.answers[key(p,q)]!=null)n++;return n;}
function activeTotal(){return activeParts().length*QPP;}
function answeredActive(){let n=0;activeParts().forEach(p=>n+=partAnswered(p));return n;}
function pctActive(){return Math.round(answeredActive()/activeTotal()*100);}
function fmt(s){const h=(s/3600|0),m=(s%3600/60|0),x=s%60;return[h,m,x].map(v=>String(v).padStart(2,'0')).join(':');}
function thaiDate(){const d=new Date();return d.getDate()+' '+THMON[d.getMonth()+1]+' '+(d.getFullYear()+543);}

function ringSVG(pct,opt={}){const r=opt.r||R,c=2*Math.PI*r,off=c*(1-pct/100),dg=opt.danger,id='g'+Math.random().toString(36).slice(2,7);
 const spClass=opt.r?'spark sm':'spark',spDash=opt.r?'12 277':'15 387';const w=opt.w||12;const track=opt.track||'#E1ECFC';
 const anim=!opt.static;
 return `<svg class="ring" width="${opt.size||150}" height="${opt.size||150}" viewBox="0 0 150 150">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${dg?'<stop offset="0" stop-color="#ff9a9d"/><stop offset="1" stop-color="var(--danger)"/>':'<stop offset="0" stop-color="var(--cyan-400)"/><stop offset="1" stop-color="var(--primary-600)"/>'}</linearGradient>
  <filter id="${id}f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="${id}s" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <circle cx="75" cy="75" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/>
  <circle class="arc" cx="75" cy="75" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" filter="url(#${id}f)"/>
  ${anim?`<circle class="${spClass}" cx="75" cy="75" r="${r}" fill="none" stroke="${dg?'#ffe3e4':'#EAFBFF'}" stroke-width="${w*.38}" stroke-linecap="round" stroke-dasharray="${spDash}" filter="url(#${id}s)"/>
  <circle class="comet" cx="${(75+r*Math.cos(2*Math.PI*pct/100)).toFixed(1)}" cy="${(75+r*Math.sin(2*Math.PI*pct/100)).toFixed(1)}" r="${w*.42}" fill="${dg?'#fff0f0':'#F2FEFF'}" filter="url(#${id}s)" opacity="${pct>0?1:0}"/>`:''}
 </svg>`;}

function renderExam(){const c=S.candidate,ss=S.session,onsite=c.mode==='onsite',isRem=ss.phase==='remedial',ap=activeParts();
 const curIdx=ap.indexOf(ss.currentPart),pct=pctActive();

   parts+=`<button class="part ${cls}" data-part="${p}"><span class="pn num">${p}</span><span class="pinfo"><b>พาร์ต ${p}</b><span class="pc num">${partAnswered(p)} / ${QPP}</span></span></button>`;});

 let cells='';for(let i=0;i<QPP;i++){const a=S.answers[key(ss.currentPart,i)]!=null;cells+=`<button class="cell ${a?'answered':''} ${i===ss.currentQ?'current':''}" data-q="${i}">${i+1}</button>`;}

 <nav class="tabs">${tabs}</nav>
 <div class="mprogress card"><span class="mpct num">${pct}%</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="mtime tv num">${fmt(ss.remaining)}</span></div>

function loadQuestion(anim){const ss=S.session,p=ss.currentPart,q=ss.currentQ,idx=(p-1+q);
 const item=(S.paper[p]&&S.paper[p][q])||{q:'',o:['','','','']};const qt=item.q,av=item.o,sel=S.answers[key(p,q)];
 $('#qbody').innerHTML=`<div class="qmeta">พาร์ต <b>${p}</b><span class="sep"></span>ข้อ <b class="num">${q+1}</b> จาก <span class="num">${QPP}</span></div>
   <h1 class="qtext">${qt}</h1><div class="options">${av.map((t,i)=>`<button class="option ${sel===i?'selected':''}" data-i="${i}"><span class="ol">${OPTL[i]}</span><span class="otx">${t}</span><span class="ock">${I.checkc}</span></button>`).join('')}</div>`;
 if(anim){const b=$('#qbody');b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap');}
 $('.options').onclick=e=>{const o=e.target.closest('.option');if(!o)return;const ci=+o.dataset.i;S.answers[key(p,q)]=ci;
   $$('.option').forEach(x=>x.classList.toggle('selected',x===o));markAnswered(q);setProgress(pctActive());syncParts();
   if(S.api&&S.api.on)apiPost('/api/xv/answer',{sessionId:S.api.id,token:S.api.token,part:p,q,choice:ci,remaining:S.session.remaining}).catch(()=>{});};
}
function markAnswered(q){const c=app.querySelector('.cell[data-q="'+q+'"]');if(c){const was=c.classList.contains('answered');c.classList.add('answered');if(!was){c.classList.add('justAns');setTimeout(()=>c.classList.remove('justAns'),360);}}}
function syncGrid(){$$('.cell').forEach(c=>{const q=+c.dataset.q;c.classList.toggle('answered',S.answers[key(S.session.currentPart,q)]!=null);c.classList.toggle('current',q===S.session.currentQ);});}
function syncParts(){$$('[data-part]').forEach(el=>{const p=+el.dataset.part;const pc=el.querySelector('.pc');if(pc)pc.textContent=partAnswered(p)+' / '+QPP;});}
function setProgress(pct){const arc=$('#qbody')?app.querySelector('.progress-card .arc'):null;
 const a=app.querySelector('.progress-card .arc');if(a)a.style.strokeDashoffset=C*(1-pct/100);
 const comet=app.querySelector('.progress-card .comet');if(comet){const ang=2*Math.PI*pct/100;comet.setAttribute('cx',(75+R*Math.cos(ang)).toFixed(1));comet.setAttribute('cy',(75+R*Math.sin(ang)).toFixed(1));comet.setAttribute('opacity',pct>0?1:0);}
 const fill=$('.mprogress .fill');if(fill)fill.style.width=pct+'%';const mpct=$('.mpct');if(mpct)mpct.textContent=pct+'%';
 const ansc=$('.ansc');if(ansc)ansc.textContent=answeredActive();
 animateNum($('.pctv'),S.session?S.session.shownPct:0,pct);if(S.session)S.session.shownPct=pct;}
function animateNum(el,from,to){if(!el)return;if(from===to){el.textContent=to+'%';return;}const t0=performance.now();
 (function step(t){const k=Math.min(1,(t-t0)/560),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));el.textContent=v+'%';if(k<1)requestAnimationFrame(step);})(performance.now());}
function tickExam(){$$('.tv').forEach(e=>e.textContent=fmt(S.session.remaining));}
function startTimer(){clearInterval(examTimer);examTimer=setInterval(()=>{const ss=S.session;if(!ss||ss.paused)return;if(ss.remaining>0){ss.remaining--;tickExam();}else{clearInterval(examTimer);doSubmit();}},1000);}

 if(S.api&&S.api.on)apiPost('/api/xv/answer',{sessionId:S.api.id,token:S.api.token,paused:true,remaining:ss.remaining}).catch(()=>{});

   <div class="mnote">${I.info}<span>หยุดเวลาได้สูงสุด ${MAXATT} ครั้ง · ครั้งละ 10 นาที · ระบบจะนับต่อเมื่อครบเวลาหรือกดทำต่อ</span></div>
   <div class="mbtns"><button class="btn btn-primary block" id="resume">ทำข้อสอบต่อเลย</button></div></div>`);

/* ---------- submit confirm ---------- */
function openSubmit(){const ap=activeParts();
 const miss=ap.map(p=>({p,n:QPP-partAnswered(p)})).filter(x=>x.n>0);
 const totalMiss=miss.reduce((a,x)=>a+x.n,0);
 const head=totalMiss?`<div class="mic warn">${I.info}</div>`:`<div class="mic ok">${I.checkc}</div>`;
 const title=totalMiss?'ยังทำข้อสอบไม่ครบ':'ยืนยันการส่งข้อสอบ';
 const sub=totalMiss?`เหลืออีก <b style="color:var(--warning)">${totalMiss}</b> ข้อที่ยังไม่ได้ทำ กรุณาตรวจสอบก่อนส่ง`:'ตอบครบทุกข้อแล้ว — เมื่อส่งแล้วจะแก้ไขไม่ได้';
 const list=totalMiss
   ? '<div class="misslist">'+miss.map(x=>`<div class="checkrow"><span class="ci2" style="color:var(--warning)">${I.info}</span><span>พาร์ต <b>${x.p}</b> · เหลือ <b style="color:var(--warning)">${x.n}</b> ข้อที่ยังไม่ได้ทำ</span></div>`).join('')+'</div>'
   : `<div class="misslist"><div class="checkrow" style="justify-content:center"><span class="ci2" style="color:var(--success)">${I.checkc}</span>ตอบครบทั้ง ${activeTotal()} ข้อแล้ว</div></div>`;
 const btns=totalMiss
   ? `<button class="btn btn-ghost" id="cxl" style="flex:1.2">${I.prev} กลับไปทำต่อจนครบ</button><button class="btn btn-primary" id="ok" style="flex:1">ยืนยันการส่งคะแนน</button>`
   : `<button class="btn btn-ghost" id="cxl" style="flex:1">ตรวจอีกครั้ง</button><button class="btn btn-primary" id="ok" style="flex:1">ยืนยันการส่งคะแนน <span class="chip">${I.check}</span></button>`;
 scrim(`<div class="modal"><div class="mstack">${head}<div class="mhead"><h3>${title}</h3><p class="msub">${sub}</p></div>${list}<div class="mbtns">${btns}</div></div></div>`);
 document.getElementById('cxl').onclick=()=>{closeScrim();
   if(totalMiss){const fp=miss[0].p;for(let q=0;q<QPP;q++){if(S.answers[key(fp,q)]==null){S.session.currentPart=fp;S.session.currentQ=q;break;}}renderExam();toast('พาไปยังข้อที่ยังไม่ได้ทำ · พาร์ต '+fp);}};
 document.getElementById('ok').onclick=()=>{closeScrim();doSubmit();};
}
function doSubmit(){clearInterval(examTimer);
 if(S.api&&S.api.on){apiPost('/api/xv/submit',{sessionId:S.api.id,token:S.api.token}).then(res=>{
   if(res&&res.ok){S.results=[1,2,3,4,5].map(p=>{const r=(res.results||[]).find(x=>x.part===p)||{};return {part:p,score:r.score||0,status:r.status||'passed',attempts:r.attempts||0,wrongIds:[]};});S.remedialQueue=res.remedialQueue||[];S.serverStatus=res.status||'';}
   S.phase='checking';render();}).catch(()=>{S.phase='checking';render();});return;}
 S.phase='checking';render();}

/* ---------- scoring ---------- */
function scoreActive(){if(S.api&&S.api.on)return;const ap=activeParts();ap.forEach(p=>{let sc=0;const wrong=[];for(let q=0;q<QPP;q++){const ok=S.answers[key(p,q)]===S.paper[p][q].c;if(ok)sc++;else wrong.push(q+1);}
   const r=S.results[p-1];r.score=sc;if(S.session.phase==='remedial')r.attempts++;r.status=sc>=PASS?'passed':'failed';r.wrongIds=wrong;});}
function afterScore(){const failed=S.results.filter(r=>r.status==='failed');
 const exhausted=failed.filter(r=>r.attempts>=MAXATT);
 if(exhausted.length){S.phase='attempts_completed';return;}
 if(failed.length===0){
   // Onsite (On-Site) candidates are auto-verified — skip the "waiting for staff" screen.
   const onsite=(S.candidate&&S.candidate.mode==='onsite')||S.serverStatus==='verified'||S.serverStatus==='submitted';
   if(onsite){S.staffVerified=true;S.phase='all_passed';}
   else S.phase='waiting_verification';
   return;}
 S.remedialQueue=failed.map(r=>r.part).sort((a,b)=>a-b);S.phase=S.session.phase==='remedial'?'remedial_result':'first_result';
}

   <div class="checklist">${activeParts().map((p,i)=>`<div class="crow ${''}" data-i="${i}"><span class="cnm">พาร์ต ${p}</span><span class="cst"><span class="mini-spin"></span>กำลังตรวจ</span></div>`).join('')}</div></div>`;

   else{clearInterval(iv);setTimeout(()=>{afterScore();render();},450);}},420);
}

function qrSVG(){let r='';for(let y=0;y<7;y++)for(let x=0;x<7;x++){if((x*3+y*5+x*y)%3===0)r+=`<rect x="${x*8}" y="${y*8}" width="8" height="8" fill="var(--primary-700)"/>`;}
 return `<svg width="56" height="56" viewBox="0 0 56 56" style="border-radius:8px;background:#fff;padding:3px">${r}</svg>`;}

/* ---------- modal helpers ---------- */
let scrimEl;
function scrim(html){if(!scrimEl){scrimEl=document.createElement('div');scrimEl.className='scrim';document.body.appendChild(scrimEl);scrimEl.onclick=e=>{if(e.target===scrimEl&&!S.session?.paused)closeScrim();};}
 scrimEl.innerHTML=html;requestAnimationFrame(()=>scrimEl.classList.add('on'));}
function closeScrim(){if(scrimEl)scrimEl.classList.remove('on');}

let tT;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2200);}

/* ---------- proctor: บันทึกพฤติกรรมระหว่างสอบ (best-effort) ---------- */
(function proctorInit(){
  var last={};
  var examing=function(){return S&&S.phase==='active_exam';};
  function report(type){
    if(!examing())return;
    var now=Date.now(); if(last[type]&&now-last[type]<800)return; last[type]=now;
    if(S.api&&S.api.on){try{fetch('/api/xv/proctor',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({sessionId:S.api.id,token:S.api.token,type:type})});}catch(e){}}
    if(type==='leave'||type==='blur')toast('⚠ ระบบบันทึกการออกจากหน้าสอบ');
    else if(type==='printscreen')toast('⚠ ระบบบันทึกการพยายามแคปหน้าจอ');
  }
  document.addEventListener('visibilitychange',function(){if(document.hidden)report('leave');});
  window.addEventListener('blur',function(){if(!document.hidden)report('blur');});
  window.addEventListener('keyup',function(e){if(e.key==='PrintScreen')report('printscreen');});
  window.addEventListener('keydown',function(e){
    if(e.key==='PrintScreen'){report('printscreen');return;}
    var k=(e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(k==='s'||k==='3'||k==='4'||k==='5'))report('printscreen');
  });
  document.addEventListener('copy',function(){report('copy');});
  document.addEventListener('contextmenu',function(e){if(examing()){e.preventDefault();report('contextmenu');}});
})();
initState();render();resolveRound();
</script>
