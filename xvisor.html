<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X-VISOR — ระบบสอบ</title>
<script>/* เปิดจากในแอป LINE → เด้งออกเบราว์เซอร์จริง (กันลิงก์หาย/ต้องสแกนใหม่) */(function(){try{var u=navigator.userAgent||'';if(/Line\//i.test(u)&&location.href.indexOf('openExternalBrowser=1')<0){var h=location.hash||'',b=location.href.slice(0,location.href.length-h.length);location.replace(b+(b.indexOf('?')>=0?'&':'?')+'openExternalBrowser=1'+h);}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap">
<style>
:root{
  --background:#F4F9FF;--surface:rgba(255,255,255,0.76);--surface-solid:#FFFFFF;
  --primary-500:#1478FF;--primary-600:#075BFF;--primary-700:#0649D8;--cyan-400:#27C8FF;
  --text-primary:#092A64;--text-secondary:#526987;--border:rgba(45,136,255,0.18);
  --success:#14A66D;--warning:#F59E0B;--danger:#E5484D;
  --radius-card:24px;--radius-control:14px;--radius-pill:999px;
  --shadow-card:0 12px 35px rgba(45,109,190,0.10),inset 0 1px 0 rgba(255,255,255,0.90);
  --glow-primary:0 0 0 1px rgba(39,200,255,0.22),0 0 24px rgba(20,120,255,0.14);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --font:"IBM Plex Sans Thai","Manrope",system-ui,sans-serif;--num:"Manrope","IBM Plex Sans Thai",sans-serif;
  --grad-primary:linear-gradient(135deg,var(--cyan-400) -30%,var(--primary-500) 42%,var(--primary-600) 108%);
  --grad-danger:linear-gradient(135deg,#ff8a8d -10%,var(--danger) 60%,#c93b40 120%);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--text-primary);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:radial-gradient(1100px 520px at 88% -12%,rgba(39,200,255,0.12),transparent 60%),radial-gradient(820px 480px at -5% -8%,rgba(20,120,255,0.10),transparent 58%),var(--background);
  background-attachment:fixed;min-height:100%}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font-family:inherit}svg{display:block}
input{font-family:inherit}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:.4}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes orbit{to{stroke-dashoffset:-402.1}}
@keyframes orbitSm{to{stroke-dashoffset:-289.0}}
@keyframes bloom{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes neonBreath{0%,100%{opacity:.92}50%{opacity:1}}
@keyframes cometPulse{0%,100%{transform:scale(.75);opacity:.85}50%{transform:scale(1.3);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes livedot{0%{box-shadow:0 0 0 0 rgba(20,166,109,.45)}70%,100%{box-shadow:0 0 0 7px rgba(20,166,109,0)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shine{0%{transform:translateX(-170%) skewX(-20deg)}20%,100%{transform:translateX(360%) skewX(-20deg)}}
@keyframes shineOnce{0%{transform:translateX(-170%) skewX(-20deg)}100%{transform:translateX(360%) skewX(-20deg)}}
@keyframes glowPulseP{0%,100%{box-shadow:0 0 0 1px rgba(39,200,255,.32),0 0 18px rgba(39,200,255,.22),0 12px 24px -12px rgba(7,91,255,.55)}50%{box-shadow:0 0 0 1px rgba(39,200,255,.5),0 0 26px rgba(39,200,255,.4),0 12px 26px -12px rgba(7,91,255,.62)}}
@keyframes miPulse{0%,100%{box-shadow:0 8px 18px -8px rgba(7,91,255,.6),0 0 0 0 rgba(39,200,255,.5)}50%{box-shadow:0 8px 18px -8px rgba(7,91,255,.6),0 0 0 8px rgba(39,200,255,0)}}
@keyframes scan{0%{top:16%;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:80%;opacity:0}}

/* ---------- primitives ---------- */
.card{position:relative;background:var(--surface);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);border:0;border-radius:var(--radius-pill);cursor:pointer;
  font-family:inherit;font-weight:600;font-size:15px;padding:13px var(--space-5);transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .2s;white-space:nowrap;position:relative;overflow:hidden}
.btn svg{width:18px;height:18px}
.btn-primary{color:#fff;background:var(--grad-primary);background-size:220% 220%;animation:gradShift 7s ease infinite,glowPulseP 3.4s ease-in-out infinite;text-shadow:0 1px 2px rgba(6,45,120,.35)}
.btn-primary::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:var(--radius-pill);background:linear-gradient(180deg,rgba(255,255,255,.42),transparent);pointer-events:none;z-index:1}
.btn-primary::after{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:26%;pointer-events:none;z-index:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-170%) skewX(-20deg);animation:shine 4.2s ease-in-out infinite}
.btn-primary>*{position:relative;z-index:2}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(39,200,255,.55),0 0 30px rgba(39,200,255,.5),0 16px 34px -12px rgba(7,91,255,.75)}
.btn-primary:hover::after{animation:shineOnce .75s var(--ease)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.btn-primary:disabled{background:linear-gradient(180deg,#a6c8f4,#8fb6ee);color:#fff;box-shadow:0 0 0 1px rgba(39,200,255,.18),inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -12px rgba(45,109,190,.45);cursor:not-allowed;animation:none;text-shadow:none}
.btn-primary:disabled::after{display:none}
.btn-ghost{color:var(--text-primary);background:linear-gradient(180deg,#fff,#f3f8ff);border:1.5px solid rgba(45,136,255,.5);box-shadow:0 6px 18px -12px rgba(45,109,190,.4)}
.btn-ghost::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(135deg,var(--cyan-400),var(--primary-500) 55%,var(--primary-600));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85;transition:opacity .25s}
.btn-ghost::after{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:24%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(39,200,255,.4),transparent);transform:translateX(-170%) skewX(-20deg);opacity:0}
.btn-ghost>*{position:relative;z-index:1}
.btn-ghost:hover{transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(45,109,190,.5),0 0 20px rgba(39,200,255,.28)}
.btn-ghost:hover::before{opacity:1}
.btn-ghost:hover::after{opacity:1;animation:shineOnce .7s var(--ease)}
.btn-danger-ghost{color:var(--danger);background:linear-gradient(180deg,#fff,#fff4f4);border:1px solid transparent}
.btn-danger-ghost::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;background:linear-gradient(135deg,#ff9a9d,var(--danger));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;transition:opacity .25s}
.btn-danger-ghost:hover{transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(229,72,77,.5),0 0 16px rgba(229,72,77,.25)}
.btn-danger-ghost:hover::before{opacity:1}
.btn.lg{font-size:16px;padding:15px var(--space-6)}
.btn.block{width:100%}
.chip{width:26px;height:26px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85)}
.slabel{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-secondary);text-transform:uppercase;display:flex;align-items:center;gap:var(--space-2)}
.slabel svg{width:16px;height:16px;color:var(--primary-500)}

/* neon ring (progress + score) */
.ringwrap{position:relative}
.ringwrap::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 56%,rgba(39,200,255,0.20) 74%,rgba(20,120,255,0.05) 84%,transparent 94%);filter:blur(5px);animation:bloom 2.8s ease-in-out infinite}
.ringwrap.danger::before{background:radial-gradient(circle,transparent 56%,rgba(229,72,77,0.20) 74%,rgba(229,72,77,0.05) 84%,transparent 94%)}
.ringwrap svg.ring{position:relative;z-index:1;transform:rotate(-90deg)}
.ringwrap .arc{transition:stroke-dashoffset .8s var(--ease);animation:neonBreath 2.8s ease-in-out infinite}
.ringwrap .spark{animation:orbit 2.6s linear infinite}
.ringwrap .spark.sm{animation:orbitSm 2.4s linear infinite}
.ringwrap .comet{transform-box:fill-box;transform-origin:center;transition:cx .8s var(--ease),cy .8s var(--ease);animation:cometPulse 1.5s ease-in-out infinite}
.ringwrap .rc{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .rc b{font-family:var(--num);font-weight:800;line-height:1;color:var(--text-primary)}
.ringwrap .rc span{font-size:12px;color:var(--text-secondary);margin-top:3px}

/* ---------- app shell ---------- */
.app{max-width:1440px;margin:0 auto;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-5);min-height:100vh}
.app>*{animation:fadeUp .5s var(--ease) both}
.app>*:nth-child(2){animation-delay:.06s}.app>*:nth-child(3){animation-delay:.12s}.app>*:nth-child(4){animation-delay:.18s}

.appbar{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5)}
.brand{font-family:var(--num);font-weight:800;letter-spacing:.14em;font-size:20px;background:var(--grad-primary);-webkit-background-clip:text;background-clip:text;color:transparent}
.appbar .title{font-weight:600;font-size:16px;color:var(--text-primary)}
.appbar .divider{width:1px;height:26px;background:var(--border)}
.appbar .spacer{flex:1}
.appbar .info{display:flex;align-items:center;gap:var(--space-2);font-size:12.5px;color:var(--text-secondary)}
.appbar .info .ii{width:32px;height:32px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;background:#EAF2FF;color:var(--primary-500)}
.appbar .info .ii svg{width:17px;height:17px}
.appbar .info b{display:block;color:var(--text-primary);font-size:13px}
.status{display:inline-flex;align-items:center;gap:var(--space-2);padding:7px var(--space-3);border-radius:var(--radius-pill);background:rgba(20,166,109,0.10);color:var(--success);font-weight:600;font-size:13px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:livedot 2s var(--ease) infinite}
.pill-rem{display:inline-flex;align-items:center;padding:6px 14px;border-radius:var(--radius-pill);background:var(--grad-danger);color:#fff;font-weight:700;font-size:12px;box-shadow:0 8px 18px -10px rgba(229,72,77,.6)}
.timer{display:inline-flex;align-items:center;gap:var(--space-3);padding:8px var(--space-4);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border)}
.timer .clk{width:22px;height:22px;color:var(--primary-500)}
.timer .tlab{font-size:11px;color:var(--text-secondary);line-height:1.15}
.timer .tval{font-family:var(--num);font-weight:800;font-size:20px;color:var(--primary-600)}

/* ---------- exam layout ---------- */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr) 328px;gap:var(--space-5);align-items:center;flex:1}
.rail{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.rail .rail-title{font-size:13px;font-weight:700}.rail .rail-sub{font-size:11px;letter-spacing:.14em;color:var(--text-secondary);font-weight:600;margin-top:-6px}
.part{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-control);cursor:pointer;border:1px solid transparent;
  transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s,border-color .25s;background:var(--surface-solid)}
.part:hover{border-color:var(--border);transform:translateX(2px)}
.part .pn{width:38px;height:38px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:15px;background:#EAF2FF;color:var(--text-secondary);transition:.25s var(--ease)}
.part .pinfo{flex:1;min-width:0}.part .pinfo b{font-size:14px;font-weight:600;display:block}.part .pinfo span{font-size:12px;color:var(--text-secondary)}
.part.active{background:linear-gradient(135deg,rgba(39,200,255,0.10),rgba(20,120,255,0.10));border-color:rgba(45,136,255,0.28);box-shadow:var(--glow-primary)}
.part.active .pn{background:var(--grad-primary);color:#fff;box-shadow:0 6px 14px -6px rgba(7,91,255,.6)}
.part.active .pinfo b{color:var(--primary-700)}
.part.done .pn{background:rgba(20,166,109,0.14);color:var(--success)}
.part.locked{opacity:.5}
.center{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.qcard{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);min-height:440px}
.qmeta{display:flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--text-secondary);font-weight:600}
.qmeta b{color:var(--primary-600)}.qmeta .sep{width:4px;height:4px;border-radius:50%;background:var(--border)}
.qtext{font-size:19px;font-weight:600;line-height:1.55}
.qbody.swap{animation:fadeUp .32s var(--ease)}
.options{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-1)}
.option{display:flex;align-items:center;gap:var(--space-3);padding:14px var(--space-4);border-radius:var(--radius-control);cursor:pointer;background:var(--surface-solid);border:1px solid var(--border);
  transition:transform .18s var(--ease),box-shadow .25s var(--ease),border-color .2s,background .2s;text-align:left;font-family:inherit;width:100%;position:relative;overflow:hidden}
.option:hover{border-color:rgba(45,136,255,0.45);transform:translateX(3px)}
.option .ol{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:15px;background:#EAF2FF;color:var(--text-secondary);transition:.22s var(--ease)}
.option .otx{flex:1;font-size:15.5px;font-weight:500;transition:color .2s}
.option .ock{width:24px;height:24px;flex:none;color:#fff;opacity:0;transform:scale(.5);transition:.28s var(--ease)}
.option.selected{background:var(--grad-primary);background-size:160% 160%;border-color:transparent;box-shadow:var(--glow-primary),0 14px 28px -14px rgba(7,91,255,0.62)}
.option.selected .otx{color:#fff}.option.selected .ol{background:rgba(255,255,255,0.2);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);transform:scale(1.05)}
.option.selected .ock{opacity:1;transform:scale(1)}
.option.selected::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-140%) skewX(-18deg);animation:sweep .7s var(--ease)}
.navrow{display:flex;align-items:center;gap:var(--space-3)}.navrow .spacer{flex:1}
.navrow.exam .qnav{min-width:132px;min-height:50px;padding-left:var(--space-4);padding-right:var(--space-4)}
.side{display:flex;flex-direction:column;gap:var(--space-5)}
.progress-card{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);align-items:center}
.progress-card .slabel{align-self:flex-start}
.progress-card .ringwrap{width:150px;height:150px}
.progress-card .rc b{font-size:34px}
.timeleft{width:100%;display:flex;align-items:center;justify-content:space-between;padding-top:var(--space-3);border-top:1px solid var(--border)}
.timeleft .tl-l{font-size:12.5px;color:var(--text-secondary);font-weight:600}.timeleft .tl-v{font-family:var(--num);font-weight:800;font-size:18px;color:var(--primary-600)}
.sheet-card{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.legend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary)}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal}.legend .ld{width:12px;height:12px;border-radius:4px}
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2)}
/* ยังไม่ตอบ = สีเทา / กำลังทำ = ขอบน้ำเงินพื้นขาว / ตอบแล้ว = น้ำเงินทึบ */
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--num);font-weight:700;font-size:14px;background:#E4EAF3;border:1px solid transparent;color:#93a1b8;transition:transform .16s var(--ease),box-shadow .2s,border-color .2s,background .25s,color .2s}
.cell:hover{border-color:rgba(45,136,255,0.4);color:var(--text-secondary);transform:translateY(-1px)}
.cell.answered{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 6px 14px -8px rgba(7,91,255,.6)}
.cell.answered.justAns{animation:pop .34s var(--ease)}
.cell.current{background:var(--surface-solid);border-color:var(--primary-500);color:var(--primary-600);box-shadow:var(--glow-primary)}
.cell.answered.current{background:var(--grad-primary);color:#fff;box-shadow:0 0 0 2px #fff inset,var(--glow-primary)}
.tabs,.mprogress,.tabbar,.tabhint{display:none}

/* ---------- centered/message screens ---------- */
.wrap-narrow{max-width:760px;margin:0 auto;width:100%}
.wrap-mid{max-width:1080px;margin:0 auto;width:100%}
.hero-h{font-size:clamp(24px,3vw,32px);font-weight:700;text-align:center}
.hero-sub{color:var(--text-secondary);text-align:center;margin-top:6px}

/* registration */
.stepper{display:flex;align-items:center;justify-content:center;gap:var(--space-2);flex-wrap:wrap}
.step{display:flex;align-items:center;gap:var(--space-2);color:var(--text-secondary);font-weight:600;font-size:14px}
.step .sn{width:34px;height:34px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;background:var(--surface-solid);border:1px solid var(--border);color:var(--text-secondary)}
.step.on{color:var(--primary-700)}.step.on .sn{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:var(--glow-primary)}
.step .dash{width:40px;height:2px;background:var(--border);border-radius:2px}
.reg-grid{display:grid;grid-template-columns:1fr 1.05fr .95fr;gap:var(--space-5);align-items:stretch}
.reg-grid.reg-solo{grid-template-columns:1fr;max-width:480px}
.onsite-note{background:var(--surface-2,#F3F7FC);border:1px solid var(--border,#E1E9F2);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:var(--space-3)}
.onsite-note b{display:block;font-size:14px}
.onsite-note small{color:var(--text-secondary,#5E7288);font-size:13px}
.field-title{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:var(--space-3)}
.rosterhit{display:flex;align-items:center;gap:9px;border-radius:var(--radius-control);padding:9px 12px;margin:-2px 0 var(--space-3);font-size:13px;animation:rhin .2s ease}
.rosterhit.ok{background:#ECFDF5;border:1px solid #A7F3D0;color:#047857}
.rosterhit .rk{width:22px;height:22px;border-radius:50%;background:#10B981;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.rosterhit .rt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.rosterhit .rt b{font-weight:700}
.rosterhit .rt .rs{font-size:11.5px;color:#3f7a5e;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes rhin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.frow{display:flex;align-items:center;gap:var(--space-3);background:linear-gradient(180deg,#fff,#f6faff);border:1px solid var(--border);border-radius:var(--radius-control);padding:11px var(--space-4);margin-bottom:var(--space-3);transition:box-shadow .22s,border-color .22s}
.frow:focus-within{border-color:rgba(45,136,255,.5);box-shadow:0 0 0 3px rgba(39,200,255,.14),0 0 18px rgba(39,200,255,.2)}
.frow .fi{width:32px;height:32px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e9f3ff,#d4e7ff);color:var(--primary-500);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:.22s}
.frow:focus-within .fi{background:var(--grad-primary);color:#fff;box-shadow:0 4px 12px -5px rgba(7,91,255,.6)}
.frow .fi svg{width:16px;height:16px}
.frow .fc{flex:1;min-width:0}.frow label{display:block;font-size:11.5px;color:var(--text-secondary);font-weight:500}
.frow input{width:100%;border:0;outline:0;background:transparent;font-size:15px;font-weight:600;color:var(--text-primary)}
.frow input::placeholder{color:#9fb0c8;font-weight:400}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);flex:1}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-2);padding:var(--space-4) var(--space-3);
  border-radius:var(--radius-control);cursor:pointer;background:var(--surface-solid);border:1.5px solid var(--border);transition:.2s var(--ease);min-height:150px}
.mode:hover{border-color:rgba(45,136,255,.4);box-shadow:0 10px 24px -16px rgba(45,109,190,.55)}
.mode .mi{width:56px;height:56px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eaf3ff,#d6e8ff);color:var(--primary-500);transition:.25s var(--ease)}
.mode .mi svg{width:26px;height:26px}
.mode .mt{font-weight:700;font-size:16px}.mode .ms{font-size:12px;color:var(--text-secondary)}
.mode .rc2{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:var(--radius-pill);border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;transition:.2s}
.mode .rc2 svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.2s var(--ease)}
.mode.on .rc2 svg{opacity:1;transform:scale(1)}
.mode.on{border-color:transparent;background:linear-gradient(135deg,rgba(39,200,255,0.10),rgba(20,120,255,0.10));box-shadow:var(--glow-primary)}
.mode.on .mi{background:var(--grad-primary);color:#fff;box-shadow:0 8px 18px -8px rgba(7,91,255,.6);animation:miPulse 2.6s ease-in-out infinite}
.mode.on .mt{color:var(--primary-700)}
.mode.on .rc2{border-color:transparent;background:var(--grad-primary);color:#fff}.mode.on .rc2 svg{width:13px;height:13px}
.campanel{flex:1;min-height:120px;border-radius:var(--radius-control);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(234,243,255,.9),rgba(214,232,255,.6));box-shadow:inset 0 0 0 1.5px rgba(39,200,255,.35),0 0 18px rgba(39,200,255,.16)}
.campanel::after{content:"";position:absolute;left:8%;right:8%;top:16%;height:2px;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--cyan-400),transparent);box-shadow:0 0 12px var(--cyan-400);animation:scan 2.8s ease-in-out infinite}
.campanel .cnr{position:absolute;width:20px;height:20px;border:2.5px solid rgba(39,200,255,.55)}
.campanel .cnr.tl{top:12px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.campanel .cnr.tr{top:12px;right:12px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.campanel .cnr.bl{bottom:12px;left:12px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.campanel .cnr.br{bottom:12px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.campanel .camic{width:44px;height:44px;color:#5f86bd;position:relative;z-index:1}.campanel .camic svg{width:44px;height:44px}
.camready{display:flex;align-items:center;justify-content:center;gap:var(--space-2);font-size:13px;font-weight:600;color:var(--success);margin-top:var(--space-2)}
.camready::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(20,166,109,.7)}
.consent{display:flex;align-items:center;gap:var(--space-3);background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius-control);padding:var(--space-3) var(--space-4);cursor:pointer;max-width:640px;margin:var(--space-4) auto 0}
.consent .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;transition:.2s}
.consent .box svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:.2s var(--ease)}
.consent.on .box{background:var(--grad-primary);border-color:transparent;box-shadow:0 0 14px rgba(39,200,255,.4)}
.consent.on .box svg{opacity:1;transform:scale(1)}
.consent b{font-size:14px;display:block}.consent span{font-size:12px;color:var(--text-secondary)}
.reg-foot{display:flex;gap:var(--space-3);margin-top:var(--space-5)}
.reg-foot .btn-primary{flex:1}

/* checking / spinner */
.spinner{width:88px;height:88px;border-radius:50%;border:6px solid rgba(20,120,255,.15);border-top-color:var(--primary-500);animation:spin 1s linear infinite;margin:var(--space-5) auto;box-shadow:0 0 26px rgba(39,200,255,.35)}
.checklist{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-4)}
.crow{display:flex;align-items:center;gap:var(--space-3);padding:13px var(--space-4);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border)}
.crow .cnm{font-weight:600}.crow .cst{margin-left:auto;font-weight:600;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.crow.done .cst{color:var(--success)}.mini-spin{width:15px;height:15px;border-radius:50%;border:2.4px solid rgba(20,120,255,.25);border-top-color:var(--primary-500);animation:spin .9s linear infinite}

/* results */
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-4)}
.pcard{padding:var(--space-4) var(--space-3);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.pcard .pp{font-weight:700;color:var(--text-secondary);font-size:14px}
.pcard .ringwrap{width:104px;height:104px}.pcard .rc b{font-size:26px}.pcard .rc span{font-size:11px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:5px 14px;border-radius:var(--radius-pill)}
.badge svg{width:15px;height:15px}
.badge.pass{color:var(--success);background:rgba(20,166,109,.10)}.badge.fail{color:var(--danger);background:rgba(229,72,77,.10)}
.rsplit{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.rpanel{padding:var(--space-5)}
.rpt{font-weight:700;margin-bottom:var(--space-4)}
.rsum{display:flex;align-items:center;gap:var(--space-4)}
.rsum .ri{flex:1;display:flex;align-items:center;gap:var(--space-3)}
.rsum .ri .ric{width:40px;height:40px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center}
.rsum .ri.ok .ric{background:rgba(20,166,109,.12);color:var(--success)}.rsum .ri.no .ric{background:rgba(229,72,77,.12);color:var(--danger)}
.rsum .ri b{font-family:var(--num);font-size:26px;font-weight:800}.rsum .ri span{font-size:12.5px;color:var(--text-secondary)}
.rsum .rdiv{width:1px;height:40px;background:var(--border)}
.lockp{display:flex;align-items:center;gap:var(--space-4)}
.lockp .li{width:52px;height:52px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;background:#EDF2F9;color:#93a3ba}
.lockp .li svg{width:24px;height:24px}
.lockp b{display:block;font-size:15px}.lockp span{font-size:13px;color:var(--text-secondary)}
.rfoot{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.note{display:flex;align-items:center;gap:var(--space-2);color:var(--text-secondary);font-size:13px}
.note svg{width:18px;height:18px;color:var(--primary-500)}

/* remedial prep */
.rem-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:var(--space-5);align-items:start}
.orbwrap{padding:var(--space-6);display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.orb{width:200px;height:200px}.orb .rc b{font-size:44px;color:var(--primary-700)}.orb .rc span{font-size:14px;color:var(--primary-600);font-weight:600}
.remq{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border)}
.remq.act{border-color:transparent;background:linear-gradient(135deg,rgba(39,200,255,0.08),rgba(20,120,255,0.08));box-shadow:var(--glow-primary)}
.remq.lock{opacity:.6}
.remq .rqn{width:44px;height:44px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:18px;background:var(--grad-primary);color:#fff}
.remq.lock .rqn{background:#D7DFEA;color:#8a99ad}
.remq .rqm{flex:1}.remq .rqm b{font-size:15px;display:block}.remq .rqm span{font-size:12.5px;color:var(--text-secondary)}
.remq .rqr{text-align:right}.remq .rqr .u{display:inline-block;background:var(--grad-primary);color:#fff;font-weight:700;font-size:12px;padding:4px 12px;border-radius:var(--radius-pill)}
.remq.lock .rqr .u{background:#c3cede}.remq .rqr small{display:block;color:var(--text-secondary);margin-top:4px;font-size:11.5px}
.remq.sel{cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .15s,background .15s}
.remq.sel:not(.on){opacity:.5}
.remq.sel:not(.on) .rqn{background:#D7DFEA;color:#8a99ad}
.remq.sel:not(.on) .rqr .u{background:#c3cede}
.remq.sel.on{border-color:transparent;background:linear-gradient(135deg,rgba(39,200,255,0.08),rgba(20,120,255,0.08));box-shadow:var(--glow-primary)}
.rules{padding:var(--space-5);display:flex;gap:var(--space-4)}
.rules .shield{width:44px;height:44px;color:var(--primary-500);flex:none}.rules .shield svg{width:44px;height:44px}
.rules ul{margin:0;padding-left:18px;color:var(--text-secondary);font-size:13.5px;line-height:1.9}

/* message screen */
.msg{max-width:640px;margin:var(--space-6) auto;padding:var(--space-6) var(--space-5);text-align:center}
.mic{width:84px;height:84px;border-radius:var(--radius-pill);margin:0 auto var(--space-4);display:flex;align-items:center;justify-content:center}
.mic svg{width:42px;height:42px}
/* submit modal: even vertical rhythm via one flex gap */
.mstack{display:flex;flex-direction:column;gap:var(--space-4)}
.mstack .mic{width:72px;height:72px;margin:0 auto}
.mstack .mic svg{width:36px;height:36px}
.mstack h3{margin:0}
.mstack .msub{margin:var(--space-1) 0 0;color:var(--text-secondary);font-size:14px}
.mstack .misslist{display:flex;flex-direction:column;gap:var(--space-2)}
.mstack .misslist .checkrow{margin:0}
.mstack .mbtns{margin-top:var(--space-1)}
.mic.info{background:rgba(20,120,255,.10);color:var(--primary-500);box-shadow:0 0 24px rgba(39,200,255,.25)}
.mic.warn{background:rgba(245,158,11,.12);color:var(--warning)}
.mic.ok{background:rgba(20,166,109,.12);color:var(--success);box-shadow:0 0 24px rgba(20,166,109,.25)}
.msg h2{font-size:22px;font-weight:700;line-height:1.4}.msg p{color:var(--text-secondary);margin-top:var(--space-3)}
/* timeline */
.tl{max-width:420px;margin:var(--space-5) auto 0;display:flex;flex-direction:column;gap:var(--space-1);text-align:left}
.tli{display:flex;align-items:center;gap:var(--space-3);padding:11px var(--space-4);border-radius:var(--radius-control);font-weight:600;color:var(--text-secondary)}
.tli .td{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center}.tli .td svg{width:24px;height:24px}
.tli.done{color:var(--success)}.tli.doing{color:var(--primary-600);background:rgba(20,120,255,.06)}
/* pass banner */
.passbanner{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-5);border-radius:var(--radius-card);
  background:linear-gradient(135deg,rgba(20,166,109,.12),rgba(39,200,255,.06));border:1px solid rgba(20,166,109,.28)}
.passbanner .pbi{width:56px;height:56px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#38d29a,#14a66d);box-shadow:0 0 22px rgba(20,166,109,.5)}
.passbanner .pbi svg{width:30px;height:30px}.passbanner b{font-size:20px;color:var(--success)}.passbanner span{color:var(--text-secondary);font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:var(--space-3)}
.bar-row{display:flex;align-items:center;gap:var(--space-3)}.bar-row .bl{width:70px;font-size:13px;font-weight:600;color:var(--text-secondary)}
.bar-row .bt{flex:1;height:10px;border-radius:var(--radius-pill);background:#E1ECFC;overflow:hidden}
.bar-row .bf{height:100%;border-radius:var(--radius-pill);background:var(--grad-primary);box-shadow:0 0 10px rgba(39,200,255,.5)}
.bar-row .bv{width:56px;text-align:right;font-family:var(--num);font-weight:800;font-size:14px;color:var(--primary-600)}
/* wrong review */
.ptabs{display:flex;gap:var(--space-2);flex-wrap:wrap}
.ptab{flex:1;min-width:110px;padding:var(--space-3);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border);cursor:pointer;text-align:center;transition:.2s}
.ptab b{display:block;font-size:14px}.ptab span{font-size:12px;color:var(--text-secondary)}
.ptab.on{background:var(--grad-primary);border-color:transparent;box-shadow:var(--glow-primary)}.ptab.on b,.ptab.on span{color:#fff}
.wq{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border);margin-bottom:var(--space-2)}
.wq .wn{font-family:var(--num);font-weight:800;color:var(--danger);font-size:16px}.wq b{flex:1;font-weight:600;font-size:14.5px}
.wq .wl{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:12px}.wq .wl svg{width:15px;height:15px}
/* certificate */
.cert{padding:var(--space-5) var(--space-6)}
.cert-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:var(--space-4);border-bottom:1px solid var(--border)}
.cert-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);padding:var(--space-4) 0;text-align:center}
.cert-meta span{font-size:12px;color:var(--text-secondary)}.cert-meta b{display:block;font-size:15px;margin-top:4px}
.ctbl{width:100%;border-collapse:collapse}
.ctbl th{text-align:left;font-size:12px;color:var(--text-secondary);font-weight:600;padding:var(--space-2) var(--space-3)}
.ctbl td{padding:12px var(--space-3);border-top:1px solid var(--border);font-size:14px}
.ctbl .cn{width:26px;height:26px;border-radius:var(--radius-pill);background:var(--grad-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:12px;margin-right:8px}
.ctbl svg{width:17px;height:17px;vertical-align:-3px;display:inline-block}
.ctbl td .res{display:inline-flex;align-items:center;gap:6px;color:var(--success);font-weight:600}
.cert-bottom{display:grid;grid-template-columns:1fr 1.1fr .8fr;gap:var(--space-4);align-items:center;margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--border)}
.cert-total{font-family:var(--num);font-size:40px;font-weight:800;color:var(--primary-700)}.cert-total span{font-size:16px;color:var(--text-secondary)}
.trophy{width:52px;height:52px;border-radius:var(--radius-pill);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad-primary);box-shadow:0 0 22px rgba(39,200,255,.45)}
.trophy svg{width:28px;height:28px}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px}

/* modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(9,42,100,.34);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:var(--space-5);opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{width:min(460px,94vw);padding:var(--space-6) var(--space-5);text-align:center;border-radius:var(--radius-card);background:linear-gradient(180deg,#fff,#f2f7ff);border:1px solid #fff;box-shadow:0 40px 90px -30px rgba(9,42,100,.5)}
.modal h3{font-size:22px;font-weight:700;margin-bottom:6px}
.pause-orb{width:184px;height:184px;margin:var(--space-4) auto}.pause-orb .rc b{font-size:40px;color:var(--primary-700)}.pause-orb .rc span{font-size:13px;color:var(--primary-600);font-weight:600}
.mnote{display:flex;gap:var(--space-2);align-items:flex-start;text-align:left;background:rgba(20,120,255,.06);border:1px solid rgba(20,120,255,.18);border-radius:var(--radius-control);padding:var(--space-3) var(--space-4);margin:var(--space-4) 0;color:var(--text-secondary);font-size:13.5px}
.mnote svg{width:20px;height:20px;color:var(--primary-500);flex:none}
.mbtns{display:flex;gap:var(--space-3)}.mbtns .btn{flex:1}
.checkrow{display:flex;align-items:center;gap:var(--space-3);background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius-control);padding:12px var(--space-4);margin-bottom:var(--space-2);text-align:left;font-weight:600;font-size:14px}
.checkrow .ci2{width:28px;height:28px;flex:none;color:var(--primary-500)}.checkrow .ci2 svg{width:28px;height:28px}

.toast{pointer-events:none;position:fixed;left:50%;bottom:var(--space-5);transform:translateX(-50%) translateY(14px);opacity:0;background:var(--text-primary);color:#fff;padding:11px var(--space-5);border-radius:var(--radius-pill);font-size:14px;font-weight:600;z-index:90;transition:.25s var(--ease);box-shadow:0 14px 30px -12px rgba(9,42,100,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.demobar{position:fixed;right:14px;bottom:14px;z-index:70;font-size:12px;color:var(--text-secondary);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-pill);padding:7px 14px;backdrop-filter:blur(10px)}
.demobar b{color:var(--primary-600);cursor:pointer}

@media (max-width:1080px){.layout{grid-template-columns:minmax(0,1fr) 300px}.rail{display:none}
  .tabbar{display:block;position:sticky;top:0;z-index:41;background:rgba(244,249,255,.82);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);margin:0 calc(-1*var(--space-5));padding:8px var(--space-5) 10px;box-shadow:0 10px 16px -14px rgba(7,60,140,.55)}
  .tabhint{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin:0 0 7px;padding-left:2px}.tabhint svg{width:14px;height:14px;color:var(--primary-500)}
  .tabs{display:flex}
  .reg-grid{grid-template-columns:1fr}.rem-grid{grid-template-columns:1fr}.rsplit{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{padding:var(--space-3);gap:var(--space-3);padding-bottom:calc(198px + env(safe-area-inset-bottom))}
  .appbar{flex-wrap:wrap;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
  .appbar .title,.appbar .divider,.appbar .info{display:none}.appbar .status{order:2}.timer{order:3;margin-left:auto}
  .layout{grid-template-columns:1fr;gap:var(--space-3);animation:none;transform:none}.side{gap:var(--space-3)}
  .qcard{min-height:0;padding:var(--space-4)}.qtext{font-size:17px}
  .tabbar{margin:0 calc(-1*var(--space-3));padding:8px var(--space-3) 10px}
  .tabs{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:10px var(--space-3);border-radius:var(--radius-control);background:var(--surface-solid);border:1px solid var(--border);cursor:pointer}
  .tab b{font-family:var(--num);font-weight:800;font-size:15px;color:var(--text-secondary)}.tab span{font-size:11px;color:var(--text-secondary)}
  .tab.active{background:var(--grad-primary);border-color:transparent;box-shadow:var(--glow-primary)}.tab.active b,.tab.active span{color:#fff}

<script>
/* ================= constants ================= */
const PARTS=5,QPP=20,TOTAL=120*60,PASS=16,MAXATT=3,REMEDIAL_MAX=MAXATT-1,PAUSE_MAX=2,OPTL=['ก','ข','ค','ง'];
/* DEMO tools (random-fill / skip) show only with ?demo=1 — hidden in production */
const DEMO=(function(){try{return /[?&]demo=1/.test(location.search);}catch(e){return false;}})();
const R=64,C=2*Math.PI*R,R2=46,C2=2*Math.PI*R2;
const THMON=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const key=(p,q)=>p+'-'+q;
// กัน XSS: escape ข้อความที่มาจากคลังข้อสอบ/รายชื่อ (ถ้ามีคนใส่ <img onerror> ในคำถาม/ชื่อ จะไม่รันสคริปต์)
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
/* mock answer key */
const QBANK={}; // ไม่ฝังข้อสอบ/เฉลยในหน้าเว็บ — ข้อสอบมาจากเซิร์ฟเวอร์ (/api/xv/start) เท่านั้น
const PARTNAME={"1": "CloverX Ecosystem บทบาท X-VISOR และโครงสร้างรายได้", "2": "Xircle App, Band, Scale และการอ่านข้อมูล", "3": "Habix, RoutineX และ Product Knowledge", "4": "โภชนาการ พฤติกรรม และการโค้ช", "5": "จรรยาบรรณ Claim Policy และ PDPA"};
let __seed;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildPaper(parts){parts.forEach(p=>{const src=QBANK[p];if(!src)throw new Error('no_local_bank');const order=shuffle(src.map((_,i)=>i));S.paper[p]=order.map(qi=>{const it=src[qi];const oi=shuffle([0,1,2,3]);return {q:it.q,o:oi.map(k=>it.o[k]),c:oi.indexOf(it.c)};});});}

/* ================= state ================= */
let S;
/* ---- backend API layer (falls back to client demo if unreachable) ---- */
async function apiPost(p,b){var _c=('AbortController'in window)?new AbortController():null;var _t=_c?setTimeout(function(){try{_c.abort();}catch(e){}},25000):null;try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{}),signal:_c?_c.signal:undefined});if(!r.ok)throw new Error('http'+r.status);return await r.json();}finally{if(_t)clearTimeout(_t);}}
async function apiGet(p,ms){var _c=('AbortController'in window)?new AbortController():null;var _t=_c?setTimeout(function(){try{_c.abort();}catch(e){}},ms||15000):null;try{const r=await fetch(p,{cache:'no-store',signal:_c?_c.signal:undefined});if(!r.ok)throw new Error('http'+r.status);return await r.json();}finally{if(_t)clearTimeout(_t);}}
function fetchT(u,o,ms){o=o||{};var _c=('AbortController'in window)?new AbortController():null;if(_c)o.signal=_c.signal;var _t=_c?setTimeout(function(){try{_c.abort();}catch(e){}},ms||20000):null;return fetch(u,o).finally(function(){if(_t)clearTimeout(_t);});}
// หยุดทุกอย่างของหน้าข้อสอบเมื่อการสอบจบ (นาฬิกา, ตัวรอบันทึก, หน้าต่างที่เปิดค้าง, คิวคำตอบ)
function stopExamUI(){try{clearInterval(examTimer);}catch(e){}try{if(_savePoll){clearInterval(_savePoll);_savePoll=null;}}catch(e){}try{closeScrim();}catch(e){}_syncQ={};}
function freshSessionAPI(phase,dur){return {phase,remaining:dur||TOTAL,currentPart:phase==='remedial'?S.remedialQueue[0]:1,currentQ:0,pauseUsed:0,shownPct:0};}
// ---- การซิงก์คำตอบแบบเชื่อถือได้: คิว + retry กันคำตอบตกหล่นจนจอผู้สอบกับหลังบ้านไม่ตรงกัน ----
var _syncQ={}, _syncing=null, _syncingAt=0;
function queueAnswer(p,q,choice){ if(!(S.api&&S.api.on))return; _syncQ[p+'-'+q]=choice; saveAnswersLocal(); flushAnswers(); }
// เก็บคำตอบไว้ในเครื่อง (localStorage) ผูกกับ session id — รีเฟรช/ปิดแท็บ/มือถือเด้งแอปแล้วคำตอบไม่หาย แม้ซิงก์ขึ้นเซิร์ฟเวอร์ยังไม่ครบ
// ลายนิ้วมือข้อสอบของแต่ละพาร์ต — คำตอบที่เก็บในเครื่องใช้ได้เฉพาะกับชุดข้อสอบเดิม (สอบซ่อม/ทีมงานเปิดพาร์ตใหม่ = สับข้อใหม่)
function paperFp(p){var a=(S.paper&&S.paper[p])||[];return a.length+'|'+(a[0]&&a[0].q?String(a[0].q).slice(0,40):'')+'|'+(a[1]&&a[1].o?String(a[1].o[0]).slice(0,20):'');}
function saveAnswersLocal(){ try{ var id=S.api&&S.api.id; if(!id)return; var f={};[1,2,3,4,5].forEach(function(p){if(S.paper&&S.paper[p])f[p]=paperFp(p);}); localStorage.setItem('xvAns_'+id, JSON.stringify({v:2,a:S.answers||{},f:f})); }catch(e){} }
function loadAnswersLocal(id){ try{ var raw=localStorage.getItem('xvAns_'+id); var o=raw?(JSON.parse(raw)||{}):{}; if(o.v!==2)return o; var out={}; Object.keys(o.a||{}).forEach(function(k){var pt=k.slice(0,k.indexOf('-')); if(o.f&&o.f[pt]&&S.paper&&S.paper[pt]&&o.f[pt]===paperFp(pt))out[k]=o.a[k];}); return out; }catch(e){ return {}; } }
function clearAnswersLocal(id){ try{ id=id||(S.api&&S.api.id); if(id)localStorage.removeItem('xvAns_'+id); }catch(e){} }
// รวมคำตอบที่เซิร์ฟเวอร์ส่งกลับกับที่เก็บไว้ในเครื่อง — ค่าที่ผู้สอบเลือกไว้ในเครื่องเป็นหลัก แล้ว re-sync ข้อที่เซิร์ฟเวอร์ยังไม่มี
function mergeLocalAnswers(id,srv){ srv=srv||{}; var out={}; Object.keys(srv).forEach(function(k){out[k]=srv[k];}); var loc=loadAnswersLocal(id); Object.keys(loc).forEach(function(k){ var v=loc[k]; if(v===null||v===undefined)return; if(out[k]!==v){ out[k]=v; _syncQ[k]=v; } }); if(Object.keys(_syncQ).length){ try{flushAnswers();}catch(e){} } return out; }
function pendingCount(){ return Object.keys(_syncQ).length; }
function pendingForPart(p){ return Object.keys(_syncQ).filter(function(k){ return k.slice(0,k.indexOf('-'))===String(p); }).length; }
function flushAnswers(){
  if(_syncing){ if(Date.now()-_syncingAt < 45000) return _syncing; _syncing=null; } // กัน deadlock: ถ้าตัวล็อกค้างเกิน 45 วิ (เช่น fetch แขวนบนเน็ตหน่วง) บังคับปลดล็อกแล้วเริ่มส่งใหม่
  if(!(S.api&&S.api.on)) return Promise.resolve();
  _syncingAt=Date.now();
  _syncing=(async function(){
    try{
      var guard=0;
      while(Object.keys(_syncQ).length && guard++<40){
        var keys=Object.keys(_syncQ);
        // ยิงทุกข้อที่ค้างพร้อมกัน (ขนาน) — เร็วกว่าบนเน็ตหน่วงมาก
        var results=await Promise.allSettled(keys.map(function(k){
          var choice=_syncQ[k]; var pq=k.split('-');
          return apiPost('/api/xv/answer',{sessionId:S.api.id,token:S.api.token,part:+pq[0],q:+pq[1],choice:choice,remaining:S.session?S.session.remaining:0})
            .catch(function(e){ if(String(e&&e.message)==='http404'){ delete _syncQ[k]; } throw e; })
            .then(function(j){ if(_syncQ[k]===choice) delete _syncQ[k]; try{ if(j&&j.remaining!=null&&S.phase==='active_exam')syncRemaining(j.remaining); }catch(e){} });
        }));
        try{ updateSyncUI(); }catch(e){}
        if(results.some(function(r){return r.status==='rejected';})){ await new Promise(function(r){setTimeout(r,700);}); } // บางข้อล้มเหลว → พักสั้น ๆ แล้ววนส่งเฉพาะที่ยังค้าง
        else break;                                                                                                       // ส่งครบแล้ว
      }
    } finally { _syncing=null; }
    try{ updateSyncUI(); }catch(e){}
  })();
  return _syncing;
}
// true เฉพาะเมื่อทุกข้อของพาร์ต p ถูกบันทึกขึ้นเซิร์ฟเวอร์ครบแล้ว
async function syncPartComplete(p){ try{ await flushAnswers(); }catch(e){} return pendingForPart(p)===0; }
async function syncAll(){ try{ await flushAnswers(); }catch(e){} return pendingCount()===0; }
// อัปเดตป้ายปุ่มหลักให้บอกสถานะการบันทึกแบบนุ่มนวล (แทน toast สีดำ)
function updateSyncUI(){ var mb=document.getElementById('mainbtn'); if(!mb||!mb.dataset.saving)return; var n=pendingForPart(S.session&&S.session.currentPart); var lbl=mb.querySelector('.mainlbl'); if(lbl)lbl.textContent=n>0?('กำลังบันทึกคำตอบ… เหลือ '+n+' ข้อ'):'บันทึกครบแล้ว'; }
// retry เบื้องหลัง: ความผิดพลาดชั่วคราวจะหายเองเมื่อเน็ตกลับมา (ถี่ขึ้น)
setInterval(function(){ if(S.api&&S.api.on&&pendingCount()) flushAnswers(); },2500);
// ส่งคำตอบค้างก่อนปิด/รีเฟรชแท็บ (best-effort)
window.addEventListener('pagehide',function(){ try{ if(S.api&&S.api.on&&pendingCount()&&navigator.sendBeacon){ Object.keys(_syncQ).forEach(function(k){ var pq=k.split('-'); navigator.sendBeacon('/api/xv/answer',new Blob([JSON.stringify({sessionId:S.api.id,token:S.api.token,part:+pq[0],q:+pq[1],choice:_syncQ[k]})],{type:'application/json'})); }); } }catch(e){} });
window.addEventListener('beforeunload',function(){ if(S.api&&S.api.on&&navigator.sendBeacon){ try{ Object.keys(_syncQ).forEach(function(k){ var pq=k.split('-'); navigator.sendBeacon('/api/xv/answer',new Blob([JSON.stringify({sessionId:S.api.id,token:S.api.token,part:+pq[0],q:+pq[1],choice:_syncQ[k],remaining:S.session?S.session.remaining:0})],{type:'application/json'})); }); }catch(e){} } });
function initState(){S={phase:'registration',api:{on:false,id:null,token:null},
  candidate:{firstName:'',lastName:'',phone:'',mode:'online',cameraConsent:false,id:'660110001'},
  answers:{}, results:Array.from({length:PARTS},(_,i)=>({part:i+1,score:0,status:'pending',attempts:0,wrongIds:[]})),
  remedialQueue:[], staffVerified:false, paper:{},
  round:null, session:null, wrongTab:1, examType:'X-Visor'};}
// ---- แบรนด์/สำเนาตามประเภทข้อสอบ: X-Lead (สอบเลื่อนระดับ) หรือ X-Visor ----
function xvBrand(){
  var lead=(S.examType==='X-Lead');
  return {
    lead:lead,
    name:lead?'X-Lead':'X-Visor',
    examTitle:lead?'สอบเลื่อนระดับการเป็น X-Lead':'สอบวัดระดับ X-Visor',
    certBrand:lead?'X-LEAD  การเลื่อนระดับ':'X-VISOR  ผลการสอบ',
    congratsTitle:lead?'ยินดีด้วย คุณสอบผ่านแล้ว!':'ยินดีด้วย คุณสอบผ่านแล้ว!',
    congratsSub:lead?'คุณสอบผ่านเพื่อก้าวสู่การเป็น X-Lead':'ผ่านเกณฑ์ X-Visor ครบทุกพาร์ต',
    stepLine:lead?'ผ่านการสอบเลื่อนระดับ เพื่อก้าวสู่การเป็น X-Lead':'ผ่านการทดสอบ X-Visor ครบทั้ง 5 พาร์ต'
  };
}
/* วาดหน้ากรอกข้อมูลใหม่โดยไม่ทำให้สิ่งที่พิมพ์ค้างหาย และคงเคอร์เซอร์ไว้ที่ช่องเดิม (เช่น ข้อมูลรอบสอบโหลดเสร็จระหว่างพิมพ์) */
function renderKeepForm(){
  var map={fn:'firstName',ln:'lastName',ph:'phone'}, a=document.activeElement, id=a&&a.id, pos=null;
  try{ if(id&&map[id]) pos=a.selectionStart; }catch(e){}
  Object.keys(map).forEach(function(k){ var e=document.getElementById(k); if(e&&S.candidate) S.candidate[map[k]]=e.value; });
  render();
  if(id&&map[id]){ var n=document.getElementById(id); if(n){ try{ n.focus({preventScroll:true}); if(pos!=null) n.setSelectionRange(pos,pos); }catch(e){} } }
}
/* resolve exam round from ?round=CODE (candidate share link) */
async function resolveRound(){
  let code=null; try{code=new URLSearchParams(location.search).get('round');}catch(e){}
  if(!code)return;
  try{const r=await fetch('/api/xv/round/'+encodeURIComponent(code));const j=await r.json();
    if(j&&j.ok){S.round=j.round; if(j.round&&j.round.examType)S.examType=j.round.examType; if(j.round&&(j.round.mode==='onsite'||j.round.mode==='online')){S.candidate.mode=j.round.mode;}} else {S.round={code,notFound:true};}
  }catch(e){S.round={code,offline:true};}
  try{document.title=xvBrand().name+' — ระบบสอบ';}catch(e){}
  if(S.phase==='registration')renderKeepForm();
}
// รอบยังไม่เปิด → เช็กสถานะรอบให้ทุก 15 วินาที เปิดแล้วหน้าเปลี่ยนเอง (ไม่ต้องรีเฟรช)
setInterval(async function(){ try{
  if(!(S&&S.phase==='registration'&&S.round&&S.round.code&&!S.round.notFound&&S.round.open!==true))return;
  var r=await fetch('/api/xv/round/'+encodeURIComponent(S.round.code),{cache:'no-store'}); var j=await r.json();
  if(j&&j.ok&&j.round&&(j.round.open!==S.round.open||S.round.offline)){ S.round=j.round; if(j.round.examType)S.examType=j.round.examType; renderKeepForm(); }
}catch(e){} },15000);
function freshSession(phase){buildPaper(phase==='remedial'?S.remedialQueue:[1,2,3,4,5]);return {phase,remaining:TOTAL,currentPart:phase==='remedial'?S.remedialQueue[0]:1,currentQ:0,pauseUsed:0,shownPct:0};}
function activeParts(){return S.session&&S.session.phase==='remedial'?S.remedialQueue.slice():[1,2,3,4,5];}
function partAnswered(p){let n=0;for(let q=0;q<QPP;q++)if(S.answers[key(p,q)]!=null)n++;return n;}
function partComplete(p){return partAnswered(p)>=QPP;}
// index (ใน activeParts) ของพาร์ตที่ "เปิดให้ทำได้" ไกลสุด — พาร์ตก่อนหน้าที่ครบแล้วเข้าไปแก้ได้ พาร์ตถัดจากนี้ล็อก
function unlockIdx(){const ap=activeParts();let i=0;while(i<ap.length-1&&partComplete(ap[i]))i++;return i;}
function firstMissingQ(p){for(let q=0;q<QPP;q++)if(S.answers[key(p,q)]==null)return q;return -1;}
function activeTotal(){return activeParts().length*QPP;}
function answeredActive(){let n=0;activeParts().forEach(p=>n+=partAnswered(p));return n;}
function pctActive(){return Math.round(answeredActive()/activeTotal()*100);}
function fmt(s){const h=(s/3600|0),m=(s%3600/60|0),x=s%60;return[h,m,x].map(v=>String(v).padStart(2,'0')).join(':');}
function thaiDate(){const d=new Date();return d.getDate()+' '+THMON[d.getMonth()+1]+' '+(d.getFullYear()+543);}

 var c=document.getElementById('sfCancel'),r=document.getElementById('sfRetry');

/* ---------- scoring ---------- */
function scoreActive(){if(S.api&&S.api.on)return;const ap=activeParts();ap.forEach(p=>{let sc=0;const wrong=[];for(let q=0;q<QPP;q++){const ok=S.answers[key(p,q)]===S.paper[p][q].c;if(ok)sc++;else wrong.push(q+1);}
   const r=S.results[p-1];r.score=sc;if(S.session.phase==='remedial')r.attempts++;r.status=sc>=PASS?'passed':'failed';r.wrongIds=wrong;});}
function afterScore(){if(S.api&&S.api.on&&S.serverStatus==='disqualified'){S.phase='disqualified';return;}
 const failed=S.results.filter(r=>r.status==='failed');
 // เซิร์ฟเวอร์ตัดจบการสอบแล้ว (หมดเวลา 120 นาที = ตก แม้สิทธิ์ซ่อมยังไม่ครบ) → ไปจอ "ไม่ผ่าน" เสมอ ไม่เสนอสอบซ่อม
 if(S.api&&S.api.on&&S.serverStatus==='ended_failed'){S.phase='attempts_completed';return;}
 const exhausted=failed.filter(r=>r.attempts>=MAXATT);
 if(exhausted.length){S.phase='attempts_completed';return;}
 if(failed.length===0){
   // Onsite (On-Site) candidates are auto-verified — skip the "waiting for staff" screen.
   const onsite=(S.candidate&&S.candidate.mode==='onsite')||S.serverStatus==='verified'||S.serverStatus==='submitted';
   if(onsite){S.staffVerified=true;S.phase='all_passed';}
   else S.phase='waiting_verification';
   return;}
 S.remedialQueue=failed.map(r=>r.part).sort((a,b)=>a-b);S.phase=S.session.phase==='remedial'?'remedial_result':'first_result';
}

 refreshBegin();
 $('#begin').onclick=async()=>{const parts=Array.from(sel).sort((a,b)=>a-b);if(!parts.length)return;
   S.remedialAttempted=parts.slice();

   var enterRemedial=function(sp,dur,paper,answers){S._starting=false;var pp2=(sp&&sp.length?sp:parts);pp2.forEach(function(pp){if(paper&&paper[pp])S.paper[pp]=paper[pp];});S.remedialQueue=pp2.slice();if(answers&&Object.keys(answers).length){S.answers=answers;}else{pp2.forEach(function(p){for(var i=0;i<QPP;i++)delete S.answers[key(p,i)];});}try{Object.keys(_syncQ).forEach(function(k){var kp=+k.slice(0,k.indexOf('-'));if(pp2.indexOf(kp)>=0)delete _syncQ[k];});}catch(e){} // ล้างคำตอบรอบก่อนที่ค้างคิว กันรั่วเข้ารอบสอบซ่อม (ชุดสับใหม่)

       if(res&&res.ok){enterRemedial(res.parts,res.durationSec,res.paper,null);return;}}catch(e){}
     if(await _recover())return;                       // เผื่อเริ่มไปแล้ว (กดซ้ำ/เน็ตหน่วง) → เข้าต่อด้วยข้อมูลจริงจากเซิร์ฟเวอร์

/* ---------- คะแนนของผู้สอบทุกครั้ง (สอบครั้งแรก / สอบซ่อม 1 / สอบซ่อม 2 / รอบพิเศษ / ทีมงานปรับคะแนน) ---------- */
function xvAttemptLabel(a){if(a.kind==='first')return 'สอบครั้งแรก';if(a.kind==='remedial')return 'สอบซ่อมครั้งที่ '+(a.no||1);if(a.kind==='special')return 'สอบรอบพิเศษ (ทีมงานอนุมัติ)';if(a.kind==='edit')return 'ทีมงานปรับคะแนน';return 'ครั้งที่ '+(a.no||'');}
function xvHistory(){var L=(S.attempts||[]).slice().sort(function(x,y){return (x.at||0)-(y.at||0);});if(!L.length)return '';
 var cnt={};L.forEach(function(a){cnt[a.kind]=(cnt[a.kind]||0)+1;if(!a.no)a.no=cnt[a.kind];});
 var rows=L.map(function(a){var ps=(a.parts||[]).slice().sort(function(x,y){return x-y;});
   var chips=ps.map(function(pt){var v=(a.perPart&&a.perPart[pt]!=null)?a.perPart[pt]:null;var ok=v!=null&&v>=PASS;
     return '<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:'+(ok?'#E7F8EF':'#FDECEC')+';color:'+(ok?'#0B7A45':'#C0352B')+'">พาร์ต '+pt+' <b class="num">'+(v==null?'-':v)+'</b>/'+QPP+'</span>';}).join('');
   var d=a.at?new Date(a.at):null;var tm=d?(('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' น.'):'';
   return '<div style="border:1px solid #E1E9F5;border-radius:14px;padding:12px 14px;text-align:left;background:#fff">'
     +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b style="color:#0A2A64;font-size:14.5px">'+xvAttemptLabel(a)+'</b><span style="color:#6B7A93;font-size:12.5px;white-space:nowrap">'+tm+(a.expired?'  หมดเวลา':'')+'</span></div>'
     +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+chips+'</div></div>';}).join('');
 return '<div style="margin-top:var(--space-5);text-align:left"><div style="font-weight:800;color:#0A2A64;margin-bottom:10px;font-size:15px">คะแนนของคุณทุกครั้ง</div><div style="display:flex;flex-direction:column;gap:8px">'+rows+'</div></div>';}

/* ---------- helpers: score ring + confetti ---------- */
function xvScoreRing(pct,size,lead,onDark){
  pct=Math.max(0,Math.min(100,pct||0));
  var s=size||132,r=52,c=2*Math.PI*r,off=c*(1-pct/100),id='sr'+Math.random().toString(36).slice(2,7);
  var g=lead?['#F4D58D','#C9962E']:['#27C8FF','#075BFF'];
  if(onDark)g=lead?['#FFF1CE','#F4D58D']:['#7CE0FF','#B9DcFF'];

function xvInFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}

/* ---------- proctor: บันทึกพฤติกรรมระหว่างสอบ (best-effort) ---------- */
(function proctorInit(){
  var last={};
  var examing=function(){return S&&S.phase==='active_exam';};
  /* หน้าที่ต้องปกป้องเนื้อหา (คำถาม/ทบทวนข้อผิด) — ห้ามแคป/คัดลอก/ลากรูป.
     หน้าคะแนนรวมเมื่อผ่านเกณฑ์ (all_passed/final_report ฯลฯ) ไม่อยู่ในนี้ = แคปได้ */
  var protectedPhase=function(){return S&&(S.phase==='active_exam'||S.phase==='wrong_review');};
  window.xvProtectedPhase=protectedPhase;
  // นับ "จำนวนครั้งที่ออกจากหน้าสอบ" (นับ 1 ครั้งต่อการออก 1 หน — รวม blur+hidden ที่มักยิงพร้อมกัน) แล้วโชว์ให้ผู้สอบเห็นเป็นตัวป้องปราม
  var leftCount=0, away=false;
  window.xvLeftCount=function(){return leftCount;};
  function noteAway(){ if(!examing()||away)return; away=true; leftCount++; }
  function noteBack(){ if(!away)return; away=false; if(examing()&&leftCount>0)toast('⚠ คุณออกจากหน้าสอบไปแล้ว '+leftCount+' ครั้ง  ระบบบันทึกไว้ให้ทีมงานแล้ว'); }
  function report(type){
    if(!examing())return;
    var now=Date.now(); if(last[type]&&now-last[type]<800)return; last[type]=now;
    if(S.api&&S.api.on){try{fetch('/api/xv/proctor',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({sessionId:S.api.id,token:S.api.token,type:type})});}catch(e){}}
    if(type==='printscreen')toast('⚠ ระบบบันทึกการพยายามแคปหน้าจอ');
    else if(type==='fullscreen_exit')toast('⚠ ออกจากโหมดเต็มจอ — ระบบบันทึกไว้ แตะปุ่ม "เข้าเต็มจอ" เพื่อกลับ');
    else if(type==='paste'||type==='copy'||type==='cut')toast('⚠ ปิดการคัดลอก/วางระหว่างสอบ — ระบบบันทึกไว้');
  }
  window.xvProctorReport=report;
  document.addEventListener('visibilitychange',function(){if(document.hidden){report('leave');noteAway();}else{noteBack();}});
  window.addEventListener('blur',function(){if(!document.hidden){report('blur');noteAway();}});
  window.addEventListener('focus',function(){noteBack();});
  window.addEventListener('keyup',function(e){if(e.key==='PrintScreen')report('printscreen');});
  window.addEventListener('keydown',function(e){
    if(e.key==='PrintScreen'){report('printscreen');return;}
    var k=(e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(k==='s'||k==='3'||k==='4'||k==='5'))report('printscreen');
  });
  document.addEventListener('copy',function(e){if(e.target&&e.target.closest&&e.target.closest('#fbOverlay'))return;if(protectedPhase()){e.preventDefault();report('copy');}});
  document.addEventListener('cut',function(e){if(protectedPhase()){e.preventDefault();report('cut');}});
  document.addEventListener('paste',function(e){if(e.target&&e.target.closest&&e.target.closest('#fbOverlay'))return;if(protectedPhase()){e.preventDefault();report('paste');}});
  document.addEventListener('selectstart',function(e){if(e.target&&e.target.closest&&e.target.closest('#fbOverlay'))return;if(protectedPhase())e.preventDefault();});
  document.addEventListener('contextmenu',function(e){if(protectedPhase()){e.preventDefault();report('contextmenu');}});
  /* กันลาก/บันทึกรูปภาพในหน้าที่ปกป้อง */
  document.addEventListener('dragstart',function(e){if(protectedPhase())e.preventDefault();});
  function onFS(){if(examing()&&!xvInFS())report('fullscreen_exit');}
  document.addEventListener('fullscreenchange',onFS);
  document.addEventListener('webkitfullscreenchange',onFS);
})();

(function forceGradeWatch(){

      if(res.status==='in_progress'){ try{ syncRemaining(res.remaining); }catch(e){} return; }

        S.remedialQueue=res.remedialQueue||[];S.serverStatus=res.status||'';S.staffVerified=!!res.staffVerified;S.attempts=res.attempts||S.attempts||[];
        stopExamUI();S.phase='checking';render();
      }
    },function(){busy=false;}).catch(function(){busy=false;});
  }

})();

    if(typeof pendingCount==='function' && pendingCount()>0){ b.style.opacity='1'; b.innerHTML='<span>ยังบันทึกไม่ครบ — แตะอีกครั้งเมื่อสัญญาณกลับมา (คำตอบยังอยู่ครบ)</span>'; return; }
    location.reload();
  };
  document.body.appendChild(b);
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') checkAppVersion(); });
setInterval(checkAppVersion,90000);

initState();mountFeedback();captureAppVer();
tryResume().then(function(ok){if(!ok){render();resolveRound();}}).catch(function(){render();resolveRound();});
</script>
